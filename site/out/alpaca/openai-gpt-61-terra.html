<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Wander</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: #dce7d5; }
  svg { display: block; width: 100%; height: 100%; }

  .walker { animation: bob 1.2s ease-in-out infinite; }
  .head { transform-origin: 736px 270px; animation: nod 2.4s ease-in-out infinite; }
  .upper, .lower {
    transform-origin: 0 0;
    animation-duration: 2.4s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-delay: var(--delay);
  }
  .upper { animation-name: stride; }
  .lower { animation-name: knee; }
  .shadow { transform-origin: 610px 584px; animation: shadow 1.2s ease-in-out infinite; }
  .tail { transform-origin: 416px 350px; animation: tail 2.4s ease-in-out infinite; }
  .grass { transform-origin: bottom; animation: breeze 4s ease-in-out infinite alternate; }
  .grass.two { animation-delay: -1.8s; }
  .dust { animation: dust 2.4s ease-out infinite; }
  .dust.second { animation-delay: -1.2s; }
  .cloud { animation: cloud 22s ease-in-out infinite alternate; }
  .cloud.second { animation-duration: 28s; animation-direction: alternate-reverse; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes stride {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(15deg); }
  }
  @keyframes knee {
    0%, 100% { transform: rotate(5deg); }
    25% { transform: rotate(-5deg); }
    50% { transform: rotate(-3deg); }
    75% { transform: rotate(20deg); }
  }
  @keyframes nod {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1.5deg); }
  }
  @keyframes shadow {
    0%, 100% { transform: scaleX(1); opacity: .24; }
    50% { transform: scaleX(.94); opacity: .18; }
  }
  @keyframes tail {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(7deg); }
  }
  @keyframes breeze {
    from { transform: rotate(-2deg); }
    to { transform: rotate(2deg); }
  }
  @keyframes dust {
    0% { opacity: 0; transform: translate(0, 0) scale(.7); }
    20% { opacity: .45; }
    100% { opacity: 0; transform: translate(-34px, -15px) scale(1.25); }
  }
  @keyframes cloud {
    from { transform: translateX(-8px); }
    to { transform: translateX(12px); }
  }
</style>
</head>
<body>
