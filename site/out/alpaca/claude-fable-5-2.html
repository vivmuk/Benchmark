<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpaca, walking</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc6e0}
  svg{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="540">
      <stop offset="0" stop-color="#4688bd"/>
      <stop offset=".5" stop-color="#8fc6e0"/>
      <stop offset=".85" stop-color="#f6e6cc"/>
      <stop offset="1" stop-color="#fbdcb4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#fff0cc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff0cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8998d2"/><stop offset="1" stop-color="#d3d9ef"/>
    </linearGradient>
    <linearGradient id="mtB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6575b8"/><stop offset="1" stop-color="#aab6df"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27356f" stop-opacity=".32"/>
      <stop offset=".7" stop-color="#27356f" stop-opacity=".06"/>
      <stop offset="1" stop-color="#27356f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dbda6"/><stop offset="1" stop-color="#a3d3ae"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a875"/><stop offset="1" stop-color="#7cc07a"/>
    </linearGradient>
    <linearGradient id="meadow" gradientUnits="userSpaceOnUse" x1="0" y1="510" x2="0" y2="720">
      <stop offset="0" stop-color="#a6d972"/><stop offset=".5" stop-color="#77bd57"/><stop offset="1" stop-color="#5aa64b"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="670" x2="0" y2="720">
      <stop offset="0" stop-color="#3f8f49"/><stop offset="1" stop-color="#2a6a3b"/>
    </linearGradient>
    <linearGradient id="fleece" gradientUnits="userSpaceOnUse" x1="130" y1="-500" x2="-70" y2="-150">
      <stop offset="0" stop-color="#fffdf8"/><stop offset=".55" stop-color="#fff3e2"/><stop offset="1" stop-color="#edd5b5"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcefdc"/><stop offset="1" stop-color="#ecd1b0"/>
    </linearGradient>
    <linearGradient id="legN" gradientUnits="userSpaceOnUse" x1="0" y1="-190" x2="0" y2="0">
      <stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#ead2b0"/>
    </linearGradient>
    <linearGradient id="legF" gradientUnits="userSpaceOnUse" x1="0" y1="-190" x2="0" y2="0">
      <stop offset="0" stop-color="#dcc6a6"/><stop offset="1" stop-color="#cbae8a"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#1b2a4a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b2a4a" stop-opacity=".34"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1010" cy="165" r="260" fill="url(#glow)"/>
  <circle cx="1010" cy="165" r="38" fill="#fffaf0"/>
</svg>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg', svg=document.getElementById('scene');
function E(tag,a,parent){var e=document.createElementNS(NS,tag);if(a)for(var k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
function R(seed){return function(){seed=(seed+0x6D2B79F5)|0;var t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function f(n){return Math.round(n*10)/10;}

/* ---------- walk constants ---------- */
var T=1.08, DUTY=.65, L=80, S=.9, V=S*L/(DUTY*T), AX=600, GY=602;

/* ---------- scrolling layers ---------- */
var layers=[];
function layer(W,factor,build){
  var g=E('g',null,svg), tile=E('g',null,g);
  build(tile,W);
  var copy=tile.cloneNode(true);
  copy.setAttribute('transform','translate('+W+',0)');
  g.appendChild(copy);
  layers.push({g:g,W:W,factor:factor});
}
function profile(W,base,comps){
  return function(x){var s=base;for(var i=0;i<comps.length;i++)s+=comps[i][1]*Math.sin(6.28318*comps[i][0]*x/W+comps[i][2]);return s;};
}
function hillPath(W,fn,bottom){
  var d='';for(var x=-20;x<=W+20;x+=20)d+=(d?'L':'M')+x+','+f(fn(x));
  return d+'L'+(W+20)+','+bottom+'L-20,'+bottom+'Z';
}
function mountains(g,W,o){
  var r=R(o.seed),n=o.n,pts=[],i;
  for(i=0;i<n;i++){
    pts.push([(i+.5+(r()-.5)*.45)*W/n,o.top+r()*o.varT]);
    pts.push([(i+1+(r()-.5)*.3)*W/n,o.base-r()*o.varB]);
  }
  var l=pts[pts.length-1];pts.unshift([l[0]-W,l[1]]);
  var d='M'+pts.map(function(p){return f(p[0])+','+f(p[1]);}).join('L')+
        'L'+f(l[0]+3)+','+f(l[1]+5)+'L'+f(l[0]+3)+','+o.bottom+'L'+f(pts[0][0])+','+o.bottom+'Z';
  E('path',{d:d,fill:o.fill},g);
  for(var k=1;k<pts.length-1;k+=2){
    var P=pts[k],A0=pts[k-1],B0=pts[k+1];
    if(P[1]<o.snowLine){
      var s=.24+r()*.1;
      var A=[P[0]+(A0[0]-P[0])*s,P[1]+(A0[1]-P[1])*s],B=[P[0]+(B0[0]-P[0])*s,P[1]+(B0[1]-P[1])*s];
      var h=(A[1]-P[1])*.38;
      var q=function(t,dy){return f(A[0]+(B[0]-A[0])*t)+','+f(A[1]+(B[1]-A[1])*t+dy);};
      E('path',{d:'M'+f(P[0])+','+f(P[1])+'L'+f(A[0])+','+f(A[1])+'L'+q(.22,h)+'L'+q(.4,h*.15)+'L'+q(.6,h*1.1)+'L'+q(.8,h*.2)+'L'+f(B[0])+','+f(B[1])+'Z',fill:'#fbfcff',opacity:.93},g);
    }
    E('path',{d:'M'+f(P[0])+','+f(P[1])+'L'+f(A0[0])+','+f(A0[1])+'L'+f(A0[0])+','+o.bottom+'L'+f(P[0]+(B0[0]-P[0])*.22)+','+o.bottom+'Z',fill:'url(#facet)'},g);
  }
}
function tree(g,x,y,s,dark,light){
  E('rect',{x:f(x-1.2*s),y:f(y-6*s),width:f(2.4*s),height:f(7*s),fill:'#6b5a3e'},g);
  E('ellipse',{cx:f(x),cy:f(y-19*s),rx:f(7*s),ry:f(15*s),fill:dark},g);
  E('ellipse',{cx:f(x+2*s),cy:f(y-21*s),rx:f(3.6*s),ry:f(10*s),fill:light,opacity:.55},g);
}
function tuft(g,x,y,s,r){
  var cols=['#4c9a44','#5fae4c','#3f8a40','#b9e27c'],c=cols[(r()*cols.length)|0],ln=(r()-.5)*4;
  E('path',{d:'M'+f(x-3*s)+','+f(y)+'q'+f(-2*s+ln)+','+f(-6*s)+' '+f(-5*s+ln)+','+f(-9*s)+
               'M'+f(x)+','+f(y)+'q'+f(ln)+','+f(-8*s)+' '+f(s+ln)+','+f(-13*s)+
               'M'+f(x+3*s)+','+f(y)+'q'+f(2*s+ln)+','+f(-6*s)+' '+f(5*s+ln)+','+f(-8*s),
    stroke:c,'stroke-width':f(1.6*s),fill:'none','stroke-linecap':'round'},g);
}
function flower(g,x,y,s,r){
  var cols=['#ffffff','#ffd75e','#ff9fb2','#d7b3ff','#ffb347'],c=cols[(r()*cols.length)|0],h=(7+r()*6)*s;
  E('path',{d:'M'+f(x)+','+f(y)+'q'+f(1.5*s)+','+f(-h/2)+' 0,'+f(-h),stroke:'#4c9a44','stroke-width':f(1.2*s),fill:'none'},g);
  E('circle',{cx:f(x),cy:f(y-h),r:f(2.6*s),fill:c},g);
  E('circle',{cx:f(x),cy:f(y-h),r:f(s),fill:c==='#ffd75e'?'#fff':'#ffcf3f'},g);
}
function bigFlower(g,x,y,s,r){
  var cols=['#ff9fb2','#fff3d6','#ffd75e','#d9b8ff'],c=cols[(r()*4)|0],h=20+r()*22;
  E('path',{d:'M'+f(x)+','+f(y)+'q'+f(4*s)+','+f(-h/2)+' 0,'+f(-h),stroke:'#2f7a3c','stroke-width':2.2,fill:'none'},g);
  var fg=E('g',{transform:'translate('+f(x)+','+f(y-h)+') scale('+f(s)+')'},g);
  for(var k=0;k<5;k++){var a=k/5*6.28318;E('circle',{cx:f(Math.cos(a)*5),cy:f(Math.sin(a)*5),r:4.2,fill:c},fg);}
  E('circle',{r:3,fill:c==='#ffd75e'?'#fff':'#ffc93c'},fg);
}
function scatter(g,W,y0,y1,nT,nF,seed,s0,s1){
  var r=R(seed),items=[],i;
  for(i=0;i<nT+nF;i++)items.push({x:r()*W,y:y0+r()*(y1-y0),fl:i>=nT});
  items.sort(function(a,b){return a.y-b.y;});
  items.forEach(function(it){var s=s0+(s1-s0)*(it.y-y0)/(y1-y0);(it.fl?flower:tuft)(g,it.x,it.y,s,r);});
}

/* clouds */
layer(2000,.05,function(g,W){
  var r=R(11);
  for(var i=0;i<7;i++){
    var c=E('g',{transform:'translate('+f(i*W/7+r()*140)+','+f(55+r()*210)+') scale('+f(.7+r()*.9)+')',fill:'#fff',opacity:f(.5+r()*.35)},g);
    [[0,0,62,20],[-40,5,34,14],[44,6,38,13],[-12,-15,30,20],[22,-9,27,17]].forEach(function(a){E('ellipse',{cx:a[0],cy:a[1],rx:a[2],ry:a[3]},c);});
  }
});
/* mountains */
layer(1800,.07,function(g,W){mountains(g,W,{seed:3,n:6,top:205,varT:80,base:420,varB:40,bottom:540,fill:'url(#mtA)',snowLine:400});});
layer(1500,.14,function(g,W){mountains(g,W,{seed:9,n:5,top:300,varT:70,base:455,varB:25,bottom:540,fill:'url(#mtB)',snowLine:338});});
/* hills */
layer(1400,.24,function(g,W){
  var fn=profile(W,455,[[2,16,0],[3,9,1.3],[7,4,2]]),r=R(5);
  for(var i=0;i<14;i++){var x=r()*W;tree(g,x,fn(x)+3,.55+r()*.3,'#69ab90','#8cc7a6');}
  E('path',{d:hillPath(W,fn,560),fill:'url(#hillA)'},g);
});
layer(1600,.4,function(g,W){
  var fn=profile(W,486,[[2,14,1],[5,8,.4],[9,3,2.2]]),r=R(8);
  E('path',{d:hillPath(W,fn,580),fill:'url(#hillB)'},g);
  for(var i=0;i<9;i++){var x=r()*W,n=1+((r()*3)|0);for(var k=0;k<n;k++){var xx=x+k*(13+r()*8);tree(g,xx,fn(xx)+5+r()*8,.75+r()*.5,'#3d8c5d','#62b077');}}
});
/* meadow */
layer(1600,.58,function(g,W){
  var fn=profile(W,516,[[2,5,0],[5,3,1]]);
  E('path',{d:hillPath(W,fn,730),fill:'url(#meadow)'},g);
  scatter(g,W,525,546,60,34,31,.6,.8);
});
layer(1600,.8,function(g,W){scatter(g,W,551,571,50,26,41,.85,1.05);});
/* dirt path - moves exactly with the feet */
layer(1600,1,function(g,W){
  var r=R(77),i,x;
  var top=profile(W,577,[[3,2.5,0],[7,1.5,1]]),bot=profile(W,629,[[2,3,2],[5,2,.5]]);
  var band=function(ins,fill){var d='',x;for(x=-20;x<=W+20;x+=20)d+=(d?'L':'M')+x+','+f(top(x)+ins);for(x=W+20;x>=-20;x-=20)d+='L'+x+','+f(bot(x)-ins);E('path',{d:d+'Z',fill:fill},g);};
  band(0,'#d3b981');band(3.5,'#e9d3a2');
  for(i=0;i<26;i++)E('ellipse',{cx:f(r()*W),cy:f(588+r()*30),rx:f(14+r()*26),ry:f(1.2+r()*1.4),fill:'#f6e7c2',opacity:.6},g);
  for(i=0;i<60;i++){var s=1.6+r()*3.2;E('ellipse',{cx:f(r()*W),cy:f(585+r()*38),rx:f(s),ry:f(s*.55),fill:r()<.5?'#c0a777':'#af9566'},g);}
  for(i=0;i<46;i++){x=r()*W;tuft(g,x,top(x)+2,.75+r()*.4,r);}
  for(i=0;i<46;i++){x=r()*W;tuft(g,x,bot(x)+3,.9+r()*.5,r);}
});

/* ---------- the alpaca ---------- */
var OUT='#a47f5b';
var alp=E('g',{transform:'translate('+AX+','+GY+') scale('+S+')'},svg);
var shadow=E('ellipse',{cx:-6,cy:1,rx:132,ry:11,fill:'#5b4320',opacity:.2},alp);

var HOOF='M-6,1L5,1Q11,4 13.5,9Q14,11 12,11L-6,11Q-8,11 -7.5,8Z';
function makeLeg(fill,hoofFill){
  var g=E('g',null,alp);
  return {
    o:E('path',{fill:OUT,stroke:OUT,'stroke-width':5.5,'stroke-linejoin':'round'},g),
    p:E('path',{fill:fill},g),
    h:E('path',{d:HOOF,fill:hoofFill,stroke:'#3b2c24','stroke-width':1.4,'stroke-linejoin':'round'},g)
  };
}
var FRONT={a:82.5,b:90.5,r:[15,9.5,8.5,5.8],dir:1,lift:24,x0:4,toe:62};
var HIND ={a:78,b:100,r:[21,10.5,9,5.8],dir:-1,lift:18,x0:-2,toe:46};
var legs=[
  {c:HIND, hx:-64,hy:-183,gy:-14,off:.5, el:makeLeg('url(#legF)','#4a3a31')},
  {c:FRONT,hx:72, hy:-183,gy:-14,off:.75,el:makeLeg('url(#legF)','#4a3a31')},
  {c:HIND, hx:-76,hy:-180,gy:-11,off:0,  el:makeLeg('url(#legN)','#5e4a3e')},
  {c:FRONT,hx:60, hy:-180,gy:-11,off:.25,el:makeLeg('url(#legN)','#5e4a3e')}
];
function cap(ax,ay,bx,by,r1,r2){
  var dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  return 'M'+f(ax+nx*r1)+','+f(ay+ny*r1)+'L'+f(bx+nx*r2)+','+f(by+ny*r2)+
         'A'+r2+','+r2+' 0 0 0 '+f(bx-nx*r2)+','+f(by-ny*r2)+
         'L'+f(ax-nx*r1)+','+f(ay-ny*r1)+'A'+r1+','+r1+' 0 0 0 '+f(ax+nx*r1)+','+f(ay+ny*r1)+'Z';
}
function circP(cx,cy,r){
  r=f(r);
  return 'M'+f(cx-r)+','+f(cy)+'A'+r+','+r+' 0 1 0 '+f(cx+r)+','+f(cy)+'A'+r+','+r+' 0 1 0 '+f(cx-r)+','+f(cy)+'Z';
}
var FLUFF=[[.35,3,1.5],[.62,-3,2],[.88,2.5,2.2],[1,0,1.6]];
function drawLeg(lg,ph,yF,yH,bob){
  var c=lg.c,p=((ph-lg.off)%1+1)%1,dx,lift=0,rot=0;
  if(p<DUTY){dx=L/2-L*p/DUTY;}
  else{
    var s=(p-DUTY)/(1-DUTY),s2=s*s,s3=s2*s,m=-L*(1-DUTY)/DUTY;
    dx=(2*s3-3*s2+1)*(-L/2)+(s3-2*s2+s)*m+(-2*s3+3*s2)*(L/2)+(s3-s2)*m;
    var sn=Math.sin(Math.PI*Math.pow(s,.85));lift=sn*sn;
    var sp=Math.sin(Math.PI*s);
    rot=c.toe*sp*Math.pow(1-s,1.3)-10*sp*s*s;
  }
  var hx=lg.hx,hy=lg.hy+(c.dir>0?yF:yH)+bob;
  var fx=lg.hx+c.x0+dx,fy=lg.gy-lift*c.lift;
  var ex=fx-hx,ey=fy-hy,d=Math.hypot(ex,ey),mx=c.a+c.b-.3;
  if(d>mx){fx=hx+ex/d*mx;fy=hy+ey/d*mx;d=mx;ex=fx-hx;ey=fy-hy;}
  var base=Math.atan2(ey,ex);
  var al=Math.acos(Math.max(-1,Math.min(1,(c.a*c.a+d*d-c.b*c.b)/(2*c.a*d))));
  var ka=base-c.dir*al,kx=hx+c.a*Math.cos(ka),ky=hy+c.a*Math.sin(ka);
  var r=c.r,path=cap(hx,hy,kx,ky,r[0],r[1])+cap(kx,ky,fx,fy,r[2],r[3]);
  var ux=kx-hx,uy=ky-hy,nx=-uy/c.a,ny=ux/c.a;
  for(var i=0;i<FLUFF.length;i++){
    var q=FLUFF[i];
    path+=circP(hx+ux*q[0]+nx*q[1],hy+uy*q[0]+ny*q[1],r[0]+(r[1]-r[0])*q[0]+q[2]);
  }
  path+=circP(kx+(fx-kx)*.93,ky+(fy-ky)*.93,r[3]+1.3);
  lg.el.o.setAttribute('d',path);
  lg.el.p.setAttribute('d',path);
  lg.el.h.setAttribute('transform','translate('+f(fx)+','+f(fy)+') rotate('+f(rot)+')');
}

/* fleece body, neck, head */
function C(p,x,y,r){return E('circle',{cx:f(x),cy:f(y),r:f(r)},p);}
function curl(p,x,y,s,rot){
  E('path',{'class':'detail',d:'M'+f(-s)+',0Q0,'+f(s*1.15)+' '+f(s)+',0',transform:'translate('+f(x)+','+f(y)+') rotate('+f(rot)+')',
    fill:'none',stroke:'#d8ba92','stroke-width':2,'stroke-linecap':'round',opacity:.75},p);
}
var up=E('g',{fill:'url(#fleece)'}),rr=R(21),i,t;
var tail=E('g',{'class':'j-tail'},up);
C(tail,-117,-258,15);C(tail,-127,-246,12.5);C(tail,-122,-269,11);
E('ellipse',{cx:-4,cy:-228,rx:112,ry:62},up);
for(i=0;i<22;i++){var th=i/22*6.28318+.12,cs=Math.cos(th),sn=Math.sin(th);C(up,-4+99*cs,-228+51*sn,21+rr()*6+(sn>.3?3:0));}
C(up,92,-238,33);C(up,100,-212,22);C(up,-104,-232,29);C(up,54,-284,24);
for(var y=-272,row=0;y<=-184;y+=22,row++)for(var x=-98+(row%2)*15;x<=96;x+=30){
  var ex=(x+4)/100,ey=(y+228)/52;
  if(ex*ex+ey*ey<1)curl(up,x+(rr()-.5)*8,y+(rr()-.5)*6,5+rr()*2.5,(rr()-.5)*50);
}
var neck=E('g',{'class':'j-neck'},up);
for(i=0;i<=8;i++){t=i/8;C(neck,78+21*t+(i%2?3.5:-3.5),-268-164*t,36-16*t);}
for(i=0;i<6;i++){t=(i+.7)/6.6;curl(neck,78+21*t+(i%2?9:-8),-268-164*t,4.5+rr()*1.5,(rr()-.5)*60);}
var head=E('g',{'class':'j-head',transform:'translate(3,-14)'},neck);
var earF=E('g',{'class':'j-earF'},head);
E('path',{d:'M103,-462Q100,-494 111,-514Q121,-494 116,-462Z',fill:'#dcc3a0'},earF);
var earN=E('g',{'class':'j-earN'},head);
E('path',{d:'M85,-460Q79,-492 89,-514Q101,-494 100,-460Z',fill:'#f7e8d0',stroke:OUT,'stroke-width':1.6},earN);
E('path',{'class':'detail',d:'M89.5,-468Q86.5,-490 90,-503Q96,-490 96,-468Z',fill:'#e7b49c',opacity:.85},earN);
E('ellipse',{cx:128,cy:-435,rx:30,ry:17.5,transform:'rotate(8 128 -435)',fill:'url(#face)'},head);
var HF=[[96,-440,25],[86,-454,15],[98,-463,15],[111,-460,13],[94,-424,17],[107,-421,12]];
var fo=E('g',{stroke:OUT,'stroke-width':5.5},head),ff=E('g',null,head);
HF.forEach(function(a){C(fo,a[0],a[1],a[2]);C(ff,a[0],a[1],a[2]);});
var det=E('g',{'class':'detail'},head);
curl(det,95,-444,5,20);curl(det,90,-428,4.5,-15);curl(det,101,-463,4,10);
E('circle',{cx:140,cy:-428,r:6,fill:'#f39a86',opacity:.35},det);

/* ---------- animation ---------- */
function twitch(t,period,dur,off){var u=((t+off)%period)/dur;return u<1?Math.sin(u*6.28318)*Math.exp(-u*2):0;}
var A=2.6;
function frame(now){
  var t=now/1000,ph=(t/T)%1,dist=t*V,i;
  for(i=0;i<layers.length;i++){
    var l=layers[i];
    l.g.setAttribute('transform','translate('+((-(dist*l.factor))%l.W).toFixed(2)+',0)');
  }
  /* shoulders rise over each planted front foot, hips over each planted hind foot */
  var yF=-A*Math.cos(4*Math.PI*(ph-.25-DUTY/2));
  var yH=-A*Math.cos(4*Math.PI*(ph-DUTY/2));
  var bob=.6*Math.sin(4*Math.PI*ph+.5);
  for(i=0;i<4;i++)drawLeg(legs[i],ph,yF,yH,bob);

  var pitch=Math.atan2(yF-yH,136)*180/Math.PI;
  var bt='translate(0,'+f(bob)+') rotate('+pitch.toFixed(2)+' -8 -180)';
  up.setAttribute('transform',bt);out.setAttribute('transform',bt);

  var na=-pitch*.9+1.8*Math.sin(4*Math.PI*ph+1.2)+1.0*Math.sin(t*.7);
  var ha=-na*.6+1.6*Math.sin(4*Math.PI*ph+2.6);
  setT('neck','rotate('+na.toFixed(2)+' 78 -262)');
  setT('head','translate(3,-14) rotate('+ha.toFixed(2)+' 98 -424)');
  setT('tail','rotate('+(8*Math.sin(4*Math.PI*ph+1)+5*Math.sin(t*3.1)).toFixed(2)+' -108 -262)');
  setT('earN','rotate('+(2*Math.sin(4*Math.PI*ph+1)+16*twitch(t,4.3,.5,0)).toFixed(2)+' 92 -466)');
  setT('earF','rotate('+(2*Math.sin(4*Math.PI*ph+1.6)-14*twitch(t,6.1,.5,2)).toFixed(2)+' 110 -466)');

  var u=t%4.7,k=u<.16?1-.92*Math.sin(Math.PI*u/.16):1;
  eye.setAttribute('transform','translate(129,-441) scale(1,'+k.toFixed(3)+') translate(-129,441)');
  shadow.setAttribute('rx',f(132+2*Math.sin(4*Math.PI*ph)));
  requestAnimationFrame(frame);
}
