<script>
(() => {
  const $ = id => document.getElementById(id);
  const ns = 'http://www.w3.org/2000/svg';
  const make = (tag, attrs, parent) => {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.appendChild(node);
    return node;
  };
  const tau = 2 * Math.PI, mod = (n, d) => ((n % d) + d) % d;
  const fmt = n => n.toFixed(2);
  let seed = 9714;
  const random = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
  const between = (a, b) => a + (b - a) * random();

  // Small raised locks: a shaded curl with a sunlit upper edge.
  const locks = [
    [102,161,.9],[120,151,1],[141,144,.8],[164,140,1.1],[187,144,.85],
    [211,138,1],[235,145,.9],[256,153,1],[277,147,.7],[297,143,.8],
    [111,180,1.15],[134,171,1],[158,163,1.22],[183,169,1],[205,159,.82],
    [226,171,1.24],[249,168,.8],[271,176,1.08],[294,164,1.2],[316,161,.78],
    [105,199,.8],[127,194,1],[150,187,1.1],[175,191,1.2],[197,183,.9],
    [216,198,1.12],[239,188,1],[259,195,.88],[284,192,1.16],[306,184,.86],
    [142,210,.82],[168,213,.7],[191,207,.92],[231,216,.77],[257,214,.8],[281,212,.84],[307,207,.7],
    [314,123,.8],[333,135,.74],[329,151,.65],[323,89,.63],[341,90,.65],[316,100,.5]
  ];
  for (const [x,y,s] of locks) {
    const g = make('g', {transform:`translate(${x} ${y}) rotate(${between(-25,21)}) scale(${s})`}, $('curls'));
    make('path', {d:'M-6 0Q-2-5 2-3Q7-2 5 2Q3 4 0 2',fill:'none',stroke:'#ae7668','stroke-opacity':between(.23,.44),'stroke-width':1.3,'stroke-linecap':'round'}, g);
    make('path', {d:'M-7-1Q-3-6 2-4',fill:'none',stroke:'#fff2d8','stroke-opacity':'.73','stroke-width':1.2,'stroke-linecap':'round'}, g);
  }

  // Repeat seamless strips of hand-shaped vegetation under the stationary hills.
  const width = 1440;
  const strips = [];
  function strip(id, count, rate, draw) {
    const root = $(id), key = id + 'Tile';
    const tile = make('g', {id:key}, root);
    for (let i=0; i<count; i++) draw(tile, (i + random()) * width / count);
    make('use', {href:'#'+key,x:width}, root);
    strips.push({root, rate});
  }
  function grass(tile, x, y, scale, color, flowers) {
    const tilt = between(-20,22);
    const g = make('g', {transform:`translate(${fmt(x)} ${fmt(y)}) rotate(${fmt(tilt)}) scale(${fmt(scale)})`}, tile);
    make('path', {d:'M0 0Q-4-8-11-13Q-3-11 1-2Q-2-13-1-23Q3-13 3-3Q6-13 15-16Q8-9 5 0Z',fill:color}, g);
    make('path', {d:'M2-1Q3-15 8-24M0 0Q-6-6-13-7',fill:'none',stroke:color,'stroke-width':'.9','stroke-linecap':'round'}, g);
    if (flowers) {
      make('path', {d:'M7-22q-2-3 0-5 2-1 3 1 1 2-3 4m-9 2q-3-3-1-6 3 0 3 3Z',fill:'#e1ad82'}, g);
    }
  }
  strip('meadow', 91, .48, (g,x) => {
    const y = between(551,584);
    grass(g,x,y,between(.21,.59),random()<.28?'#c39581':'#795d66',random()<.24);
  });
  strip('stones', 88, 1, (g,x) => {
    const y = between(593,666), rx = between(.6,4.8), ry = rx*between(.17,.36);
    make('ellipse', {cx:x,cy:y,rx,ry,fill:'#805c60',opacity:between(.14,.32)},g);
    if(rx>2.8) make('path',{d:`M${fmt(x-rx*.8)} ${fmt(y)}q${fmt(rx*.75)} ${fmt(-ry*2)} ${fmt(rx*1.35)} ${fmt(-ry*.75)}`,fill:'none',stroke:'#f1c1a2','stroke-opacity':'.49','stroke-width':'.75'},g);
  });
  strip('verge', 112, 1.23, (g,x) => {
    const y = between(688,738);
    const palette = ['#9f7976','#765661','#c0927c','#604857','#ad8478'];
    grass(g,x,y,between(.36,1.13),palette[Math.floor(random()*palette.length)],random()<.19);
  });

  // A four-beat walk: near hind, near fore, far hind, far fore.
  // During stance the foot travels at exactly the trail's speed.
  const period = 1.34, contact = .64, stride = 49;
  const trailSpeed = stride * 1.16 / (period * contact);
  const legs = [
    {x:134,y:197,floor:313,beat:.50,hind:true,far:true},
    {x:301,y:193,floor:313,beat:.75,hind:false,far:true},
    {x:116,y:199,floor:319,beat:0,hind:true,far:false},
    {x:284,y:197,floor:319,beat:.25,hind:false,far:false}
  ];
  for (const leg of legs) {
    const layer = leg.far ? $('farLegs') : $('nearLegs');
    leg.shadow = make('ellipse',{cy:leg.floor,rx:15,ry:3.7,fill:'url(#shadow)'},$('footShadows'));
    leg.shape = make('path',{
      fill:`url(#${leg.far?'farleg':'foreleg'})`,stroke:leg.far?'#805b58':'#a47568',
      'stroke-width':1.05,'stroke-linejoin':'round'
    },layer);
    leg.shine = make('path',{fill:'none',stroke:leg.far?'#dbad97':'#f9dfbc','stroke-width':1.15,'stroke-opacity':'.72','stroke-linecap':'round'},layer);
    leg.toes = make('g',{},layer);
    make('path',{d:'M-4-5Q0-7 4-4L6.5 0Q9 3 8 7Q6.5 9 2.5 8.7L.8 8.1Q-2 9.4-5.2 7.5Q-6.6 5-5.5 1Z',fill:leg.far?'#6c4b4d':'#865d57',stroke:'#6f4e4d','stroke-width':'.7'},leg.toes);
    make('path',{d:'M-3.8 1.3Q.1-1.1 4.9 2.2M1.4 4.7l-.6 3.4',fill:'none',stroke:leg.far?'#9e746b':'#c59782','stroke-width':'.9','stroke-linecap':'round'},leg.toes);
  }

  const point = (x,y) => `${fmt(x)} ${fmt(y)}`;
  function drawLeg(leg, cycle, dx, dy, angle) {
    const phase = mod(cycle - leg.beat, 1);
    let travel, lift = 0, roll = 0;
    if (phase < contact) {
      travel = stride * (.5 - phase / contact);
    } else {
      const u = (phase-contact)/(1-contact);
      // Hermite swing keeps horizontal velocity continuous at toe-off and landing.
      travel = -stride/2 + stride*(3*u*u-2*u*u*u)
        - stride*(1-contact)/contact*u*(1-u)*(1-2*u);
      lift = (leg.hind?23:27) * Math.pow(Math.sin(Math.PI*u),1.6);
      roll = 23*Math.sin(tau*u)*Math.sin(Math.PI*u);
    }
    const ax = leg.x + travel + (leg.hind ? -4 : 3);
    const ay = leg.floor - 8.7 - lift;
    const c = Math.cos(angle), s = Math.sin(angle);
    const hx = 210 + (leg.x-210)*c - (leg.y-170)*s + dx;
    const hy = 170 + (leg.x-210)*s + (leg.y-170)*c + dy;

    // Two-bone IK: the foreleg flexes forward at the knee, the hind leg back at the hock.
    const L1 = leg.hind ? 62 : 61, L2 = 60;
    const vx = ax-hx, vy = ay-hy, distance = Math.hypot(vx,vy);
    const ux = vx/distance, uy = vy/distance;
    const d = Math.min(distance,L1+L2-.001);
    const along = (L1*L1-L2*L2+d*d)/(2*d);
    const bend = Math.sqrt(Math.max(0,L1*L1-along*along))*(leg.hind?-1:1);
    const kx = hx + ux*along + uy*bend, ky = hy + uy*along - ux*bend;
    const l1 = Math.hypot(kx-hx,ky-hy), l2 = Math.hypot(ax-kx,ay-ky);
    const n1x = -(ky-hy)/l1, n1y = (kx-hx)/l1;
    const n2x = -(ay-ky)/l2, n2y = (ax-kx)/l2;
    const nm = Math.hypot(n1x+n2x,n1y+n2y);
    const nx = (n1x+n2x)/nm, ny = (n1y+n2y)/nm;
    const off = (x,y,nx,ny,w) => point(x+nx*w,y+ny*w);
    const h = w => off(hx,hy,n1x,n1y,w);
    const q = w => off(hx*.49+kx*.51,hy*.49+ky*.51,n1x,n1y,w);
    const k = w => off(kx,ky,nx,ny,w);
    const b = w => off(kx*.46+ax*.54,ky*.46+ay*.54,n2x,n2y,w);
    const a = w => off(ax,ay,n2x,n2y,w);
    const w = leg.hind ? 15 : 12;
    leg.shape.setAttribute('d',`M${h(w)} Q${q(w*.8)} ${k(5.7)} Q${b(3.5)} ${a(4)}
      L${a(-4.4)} Q${b(-3.2)} ${k(-5.4)} Q${q(-w*.64)} ${h(-w)}Z`);
    leg.shine.setAttribute('d',`M${q(5.7)} Q${k(4.2)} ${b(2.05)} T${a(2.35)}`);
    leg.toes.setAttribute('transform',`translate(${fmt(ax)} ${fmt(ay)}) rotate(${fmt(roll)})`);
    leg.shadow.setAttribute('cx',fmt(ax+2));
    leg.shadow.setAttribute('opacity',fmt(.79-lift*.024));
  }

  const body = $('body'), head = $('head'), tail = $('tail'), eye = $('eye');
  const nearEar = $('nearEar'), farEar = $('farEar'), tassels = $('tassels');
  const start = performance.now();
  function frame(now) {
    const time = (now-start)/1000, cycle = time/period, wave = tau*cycle;
    const dx = 1.65*Math.sin(wave-.5);
    const dy = 1.8*Math.cos(2*wave+.4) + .5*Math.sin(wave);
    const pitch = .9*Math.sin(wave+.6) + .34*Math.sin(2*wave);
    body.setAttribute('transform',`translate(${fmt(dx)} ${fmt(dy)}) rotate(${fmt(pitch)} 210 170)`);
    head.setAttribute('transform',`rotate(${fmt(-.7*pitch + 1.35*Math.sin(2*wave-.8))} 340 64)`);
    tail.setAttribute('transform',`rotate(${fmt(5*Math.sin(wave-.5)+2*Math.sin(time*2.3))} 94 156)`);
    nearEar.setAttribute('transform',`rotate(${fmt(2.1*Math.sin(wave-.7)+1.25*Math.sin(time*4.2))} 329 24)`);
    farEar.setAttribute('transform',`rotate(${fmt(2.8*Math.sin(wave+1.1))} 353 23)`);
    tassels.setAttribute('transform',`rotate(${fmt(6.8*Math.sin(2*wave-1.15)+2*Math.sin(wave))} 343 110)`);
    const blink = mod(time+2.2,5.6);
    const open = blink < .17 ? 1-.91*Math.pow(Math.sin(Math.PI*blink/.17),1.45) : 1;
    eye.setAttribute('transform',`translate(0 ${fmt(44*(1-open))}) scale(1 ${fmt(open)})`);
    $('bodyShadow').setAttribute('cx',fmt(210+dx*2));
    for (const leg of legs) drawLeg(leg,cycle,dx,dy,pitch*Math.PI/180);
    for (const {root,rate} of strips) root.setAttribute('transform',`translate(${fmt(-mod(time*trailSpeed*rate,width))} 0)`);
    requestAnimationFrame(frame);
  }
  frame(start);
})();
</script>
</body>
</html>
