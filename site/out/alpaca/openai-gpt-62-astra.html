<script>
(() => {
  'use strict';
  const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
  function make(tag,attrs,parent) {
    const e=document.createElementNS(NS,tag);
    for(const k in attrs)e.setAttribute(k,attrs[k]);
    if(parent)parent.appendChild(e);
    return e;
  }
  let seed=15483;
  const rnd=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
  const range=(a,b)=>a+(b-a)*rnd(), pick=a=>a[Math.floor(rnd()*a.length)];
  const n=x=>Number(x.toFixed(2)), tau=Math.PI*2;
  const path=(parent,d,attrs)=>make('path',{d,...attrs},parent);

  // A static tile of fine paper tooth; no animated image filters.
  const tile=document.createElement('canvas'); tile.width=tile.height=176;
  const ctx=tile.getContext('2d'), img=ctx.createImageData(176,176);
  for(let i=0;i<img.data.length;i+=4) {
    const v=Math.floor(range(0,256));
    img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0); $('paper').setAttribute('href',tile.toDataURL());

  function tussock(parent,x,y,s,palette,flower=false) {
    let leaves='',glints='';
    const count=6+Math.floor(rnd()*6);
    for(let i=0;i<count;i++){
      const root=range(-4,4)*s, h=range(5,15)*s, bow=range(-9,10)*s;
      leaves+=`M${n(x+root-1.4*s)} ${n(y)}q${n(bow*.32)} ${n(-h*.63)} ${n(bow)} ${n(-h)}q${n(-bow*.65)} ${n(h*.69)} ${n(2.4*s-bow)} ${n(h)}Z`;
      if(i%3===0)glints+=`M${n(x+root)} ${n(y-s)}q${n(bow*.2)} ${n(-h*.52)} ${n(bow*.86)} ${n(-h*.88)}`;
    }
    path(parent,leaves,{fill:palette[0]});
    path(parent,glints,{fill:'none',stroke:palette[1],'stroke-width':n(.9*s),'stroke-linecap':'round'});
    if(flower)for(let j=0;j<3;j++){
      const dx=range(2,12)*s,dy=range(14,21)*s;
      path(parent,`M${n(x)} ${n(y)}q${n(dx*.27)} ${n(-dy*.63)} ${n(dx)} ${n(-dy)}`,{fill:'none',stroke:palette[1],'stroke-width':n(s*.8)});
      make('ellipse',{cx:n(x+dx),cy:n(y-dy),rx:n(1.3*s),ry:n(3.4*s),fill:palette[2],transform:`rotate(29 ${n(x+dx)} ${n(y-dy)})`},parent);
    }
  }

  const lm=$('landmarks'), gm=$('groundmarks'), cm=$('closemarks');
  for(let i=0;i<270;i++){
    const x=range(0,1280),y=range(426,469),w=range(1,11);
    path(lm,`M${n(x)} ${n(y)}q${n(w*.35)} -2 ${n(w)} -.6`,{fill:'none',stroke:pick(['#839a83','#9aa78a','#cad0a4']),'stroke-width':range(.6,1.3)});
  }
  for(let i=0;i<270;i++){
    const x=range(0,1280),y=range(480,697), w=range(2,12)*(y-420)/180;
    path(gm,`M${n(x)} ${n(y)}q${n(w*.49)} ${n(-w*.2)} ${n(w)} -.2q${n(-w*.45)} 1.6 ${n(-w)} .2Z`,{fill:pick(['#b09876','#eed3a3','#bab08b','#c2a27d']),opacity:range(.5,.95)});
  }
  for(let i=0;i<108;i++){
    const x=range(10,1269), y=i<49?range(469,526):range(596,706),s=range(.35,.78)*(y-340)/250;
    tussock(gm,x,y,s,pick([['#9c9e75','#d3c58d','#edce92'],['#b2a172','#e5ca91','#f4daa0'],['#939a74','#bfbb89','#e7cd93']]),i%6===0);
  }
  // Foreground vegetation runs on its own very low strip, framing rather than hiding the feet.
  for(let i=0;i<62;i++){
    const x=range(15,1264),y=range(704,750),s=range(.85,2.4);
    tussock(cm,x,y,s,pick([['#526e60','#9ca483','#d0ba88'],['#49675b','#899a7c','#d4bf92'],['#75856a','#b4ae82','#ddc597']]),i%4===0);
  }

  // Short groups of tapered fleece marks, rather than a uniform scallop pattern.
  const wool=$('locks');
  for(let i=0;i<196;i++){
    const x=range(-107,83),y=range(-144,26),s=range(.6,1.65);
    if(x>28&&y<-20 || y>-48) {
      const a=range(.14,.38), tall=x>36&&y<-31;
      path(wool,`M${n(x)} ${n(y)}q${n((tall?.8:1.7)*s)} ${n(2.8*s)} ${n((tall?-1.4:3.8)*s)} ${n((tall?6:2.2)*s)}`,{
        stroke:pick(['#bba28a','#fff5dc','#fff8df']),'stroke-width':n(range(.7,1.65)),opacity:n(a+.12)
      });
    }
  }
  const fringe=$('fringe');
  for(let j=0;j<17;j++){
    const x=-71+j*3.55,y=-9+5.1*Math.sin(j*Math.PI/16),length=3.6+(j%3===0?1.9:0);
    path(fringe,`M${x} ${y-1}l-.9 ${length}`,{stroke:j%3===0?'#be724f':'#dac193','stroke-width':1.8});
  }

  // Four independent planted-foot cycles. Each leg solves a two-link chain
  // from its moving upper joint to the fetlock; hind hocks fold the other way.
  const legs=[];
  function addLeg(hind,far,offset) {
    const g=make('g',{},$(far?'farLegs':'nearLegs'));
    legs.push({hind,far,offset,
      shadow:make('ellipse',{cy:101.1,rx:8,ry:1.4,fill:'#766656'},$('contacts')),
      limb:path(g,'',{fill:far?'url(#farleg)':'url(#nearleg)'}),
      gleam:path(g,'',{fill:'none',stroke:far?'#c8b39a':'#fff0d0','stroke-linecap':'round','stroke-width':far?1.15:1.65,opacity:.67}),
      toe:path(g,'',{fill:far?'#6e6258':'#927b68'}),
      split:path(g,'',{fill:'none',stroke:far?'#574f49':'#67594e','stroke-width':.85,'stroke-linecap':'round'})
    });
  }
  addLeg(true,true,.50); addLeg(false,true,.35);
  addLeg(true,false,0); addLeg(false,false,.85);

  const stance=.64,span=42,duration=1.36,speed=span/stance/duration*1.35;
  function pose(l,cycle,bob,sway,lean) {
    const p=(cycle+l.offset)%1, {hind,far}=l;
    const hipx=(hind?-76:37)+(far?5:-2),hipy=(hind?3:0);
    const hx=hipx+sway,hy=hipy+bob+hipx*lean;
    let dx,up=0,roll=0;
    if(p<stance){
      dx=span*(.5-p/stance);
      roll=Math.pow(Math.max(0,(p/stance-.80)/.20),2)*.36;
    }else{
      const u=(p-stance)/(1-stance), smooth=u*u*(3-2*u);
      const adjust=-span*(1-stance)/stance*u*(1-u)*(1-2*u);
      dx=-span/2+span*smooth+adjust;
      up=(hind?15:19)*Math.pow(Math.sin(Math.PI*u),1.55);
      roll=.36*(1-smooth)+.42*Math.sin(u*tau)*(1-u);
    }
    const footx=hipx+(hind?0:1)+dx,footy=100.8-(far?1.4:0)-up;
    const ax=footx-2.6, ay=footy-5.5-Math.sin(roll)*3.5;
    const ux=hx+(hind?11:-7)+dx*.14,uy=hy+(hind?31:27)-up*.12;
    const vx=ax-ux,vy=ay-uy,d=Math.max(.01,Math.hypot(vx,vy));
    let a=hind?32:35,b=hind?39:39;
    if(a+b<d+1){let k=(d+1)/(a+b);a*=k;b*=k}
    const line=(a*a-b*b+d*d)/(2*d),side=Math.sqrt(Math.max(0,a*a-line*line))*(hind?1:-1);
    const kx=ux+vx/d*line-vy/d*side,ky=uy+vy/d*line+vx/d*side;
    const W=hind?13:11,kw=hind?4.3:4.5;
    const pt=(x,y)=>`${n(x)} ${n(y)}`;
    l.limb.setAttribute('d',`M${pt(hx-W,hy-8)}
      Q${pt(hx-W-3,hy+8)} ${pt(ux-7,uy)}
      Q${pt(ux-5.2,uy+4)} ${pt(kx-kw,ky-2)}
      Q${pt(kx-kw-1,ky+2)} ${pt(kx-kw+.7,ky+5)}
      L${pt(ax-3,ay-4)} Q${pt(ax-4.8,ay)} ${pt(ax-2.7,ay+3.4)}
      Q${pt(ax+.8,ay+7.2)} ${pt(footx+6,footy-.4)}
      Q${pt(footx+8,footy-2.3)} ${pt(ax+3.4,ay-.3)}
      L${pt(kx+kw-.4,ky+5)} Q${pt(kx+kw+1,ky+1.7)} ${pt(kx+kw,ky-3)}
      Q${pt(ux+5.2,uy+5)} ${pt(ux+7.1,uy-.8)}
      Q${pt(hx+W+2,hy+10)} ${pt(hx+W,hy-7)}Z`);
    l.gleam.setAttribute('d',`M${pt(kx+1.7,ky+6)}Q${pt((kx+ax)/2+2,(ky+ay)/2)} ${pt(ax+1.5,ay-7)}`);
    const tx=footx,ty=footy,angle=roll*180/Math.PI;
    l.toe.setAttribute('d',`M${pt(tx-5.2,ty-4.6)}q3.8 1.8 5.1-.2 3.1-1.7 6.3.7 2.8 1.6 2.4 3.6-5.2 1.9-11 .6-2.4-1.1-2.8-4.7Z`);
    l.split.setAttribute('d',`M${pt(tx+3.2,ty-3.3)}q2 .8 2.4 2.8`);
    for(const e of [l.toe,l.split])e.setAttribute('transform',`rotate(${n(angle)} ${n(tx+6)} ${n(ty)})`);
    l.shadow.setAttribute('cx',n(footx));l.shadow.setAttribute('opacity',n(.04+.20*(1-up/19)));
    l.shadow.setAttribute('rx',n(7+up*.16));
  }

  const start=performance.now();
  function frame(now) {
    const t=(now-start)*.001,cycle=t/duration,v=cycle*tau;
    const bob=-1.75*Math.cos(2*v-.33),sway=1.35*Math.sin(v+.65),lean=.009*Math.sin(v-.27);
    $('body').setAttribute('transform',`translate(${n(sway)} ${n(bob)}) rotate(${n(lean*180/Math.PI)})`);
    $('head').setAttribute('transform',`rotate(${n(1.4*Math.sin(v*2-.60)-.9*Math.sin(v))} 67 -123)`);
    $('tail').setAttribute('transform',`rotate(${n(4.3*Math.sin(v-.55)+1.8*Math.cos(2*v))} -95 -35)`);
    $('ear').setAttribute('transform',`rotate(${n(1.6*Math.sin(v-.7)+4*Math.pow(Math.max(0,Math.sin(t*.93)),24)*Math.sin(t*13))} 62 -145)`);
    $('farEar').setAttribute('transform',`rotate(${n(2.1*Math.sin(v+.6))} 74 -145)`);
    const blink=Math.pow(Math.max(0,Math.cos(t*1.26+2)),450);
    $('eye').setAttribute('transform',`translate(0 -134.7) scale(1 ${n(1-.92*blink)}) translate(0 134.7)`);
    legs.forEach(l=>pose(l,cycle,bob,sway,lean));
    for(const [id,factor] of [['distantGrass',.19],['field',1],['foreground',1.44]]){
      $(id).setAttribute('transform',`translate(${n(-((t*speed*factor)%1280))} 0)`);
    }
    $('clouds').setAttribute('transform',`translate(${n(12*Math.sin(t*.033))} 0)`);
    requestAnimationFrame(frame);
  }
  frame(start);
})();
</script>
</body>
</html>
