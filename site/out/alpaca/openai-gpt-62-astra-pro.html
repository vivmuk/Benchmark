<script>
(() => {
  'use strict';
  const ns = 'http://www.w3.org/2000/svg', by = id => document.getElementById(id);
  const el = (name, attrs, parent) => {
    const n = document.createElementNS(ns, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n); return n;
  };
  let seed = 8381;
  const rnd = () => ((seed = (Math.imul(seed,1664525)+1013904223)>>>0) / 4294967296);
  const pick = a => a[Math.floor(rnd()*a.length)];
  const f = n => +n.toFixed(2), tau = Math.PI*2;
  const use = (parent,id,x,y,s,c,lean=0) => el('use',{href:'#'+id, transform:`translate(${f(x)} ${f(y)}) skewX(${f(lean)}) scale(${f(s)})`,fill:c},parent);

  // Tiny irregular ink marks are generated once, never randomized between frames.
  for (let i=0;i<154;i++){
    const x=rnd()*1280,y=443+rnd()*56,s=.055+.16*(y-438)/62*rnd();
    use(by('pastureDetails'),'grass',x,y,s,pick(['#929a77','#aa9c73','#dcca97']),-12);
    if(i%4===0) el('path',{d:`M${f(x)} ${f(y+1)}q9-2 23 0-13-1-23 0`,fill:'#a79f7c'},by('pastureDetails'));
  }
  for(let i=0;i<162;i++){
    const x=rnd()*1280,y=507+rnd()*92,w=1+rnd()*10;
    el('path',{d:`M${f(x)} ${f(y)}q${f(w*.3)} ${f(-1-rnd()*2)} ${f(w)} -.5l${f(w*.5)} 1Z`, fill:pick(['#b38964','#f7dcad','#c29b72','#d2ab80']),opacity:f(.4+rnd()*.4)},by('trailDetails'));
  }
  for(let i=0;i<122;i++){
    const x=rnd()*1280,y=597+9*Math.sin(tau*x/1280*2)+rnd()*36;
    use(by('bankGrass'),'grass',x,y,.19+rnd()*.39,pick(['#b6a675','#9d9970','#caba85','#a59e73']),-14+rnd()*12);
  }
  for(let i=0;i<48;i++){
    const x=7+rnd()*1265,y=635-6*Math.sin(x*tau/1280*3)+rnd()*4;
    use(by('frontGrass'),'grass',x,y,.49+rnd()*.54,pick(['#75846b','#859071','#a19b71','#647d68']),-8+rnd()*18);
    if(i%4===0) use(by('frontGrass'),'plume',x+3,y,.59+rnd()*.38,'none',-14);
  }
  for(let i=0;i<76;i++){
    const x=rnd()*1280,y=640+rnd()*72,w=3+rnd()*18;
    el('path',{d:`M${f(x)} ${f(y)}q${f(w*.4)} -2 ${f(w)} -1`,fill:'none',stroke:'#aac09c','stroke-width':1,opacity:f(.08+rnd()*.15)},by('frontMarks'));
  }
  // Broken crescent marks follow the fleece rather than outlining every curl.
  for(let i=0;i<146;i++){
    const neck=i>91;
    const x=neck?52+rnd()*65:-125+rnd()*231, y=neck?-303+rnd()*115:-223+rnd()*99;
    const s=.55+rnd()*.65;
    el('path',{d:pick(['M-4-1q3 5 7 0','M-4 0q1 4 5 3 3 1 4-2','M-3 1q2 2 5-1']),transform:`translate(${f(x)} ${f(y)}) rotate(${f((neck?-26:0)+rnd()*34-17)}) scale(${f(s)})`,stroke:rnd()<.48?'#fff8df':'#b89876','stroke-width':f(1.1+rnd()*.95),opacity:f(.25+rnd()*.33)},by('curls'));
  }
  for(let i=0;i<15;i++){
    const a=i/14,x=-78+91*a,y=(1-a)*(1-a)*-168+2*a*(1-a)*-157+a*a*-176;
    el('path',{d:`M${f(x)} ${f(y-2)}q1 4 ${f(1.4+rnd()*2)} ${f(6+rnd()*2)}`,stroke:i%3===0?'#b7593f':'#e6c28a','stroke-width':3},by('fringe'));
  }
  for(let i=0;i<7;i++){
    const x=-90+i*19,y=-196+1.6*Math.sin(i/6*Math.PI);
    el('path',{d:`M${x-9} ${y}l4-2v-2h3v-3h4v3h3v2l4 2-4 2v2h-3v3h-4v-3h-3v-2Z`,fill:'#efc68c'},by('diamonds'));
    el('path',{d:`M${x-3} ${y}l3-3 3 3-3 3Z`,fill:'#b95841'},by('diamonds'));
  }

  // Four independent feet: constant ground speed in stance; eased recovery.
  // The front carpus folds forward, while the rear hock folds backward.
  const legs = [];
  for(const [fore,far,offset] of [[false,true,.5],[true,true,.36],[false,false,0],[true,false,.86]]){
    const g=el('g',{},by('limbs'));
    legs.push({fore,far,offset,
      cast:el('ellipse',{cy:1,rx:10,ry:1.8,fill:'#806349'},by('shade')),
      shape:el('path',{fill:far?'url(#legCool)':'url(#legWarm)'},g),
      light:el('path',{fill:'none',stroke:far?'#bdab8d':'#f2dbb5','stroke-width':2.3,'stroke-linecap':'round',opacity:.68},g),
      foot:el('g',{},g)
    });
    const foot=legs[legs.length-1].foot;
    el('path',{d:'M-4-10Q1-13 4-9L6-5Q12-4 12-1Q8 1 2 0L-5 0Q-7-2-5-6Z',fill:far?'#837263':'#a0836c'},foot);
    el('path',{d:'M4-4Q10-5 12-1Q10 .5 5 0Z',fill:far?'#665e54':'#776355'},foot);
    el('path',{d:'M3-4q4 1 4.5 3.4',stroke:'#6c5a4e','stroke-width':.8,fill:'none'},foot);
  }
  function smoothClosed(points){
    const n=points.length, mid=(a,b)=>`${f((a[0]+b[0])*.5)} ${f((a[1]+b[1])*.5)}`;
    let d='M'+mid(points[n-1],points[0]);
    for(let i=0;i<n;i++)d+=`Q${f(points[i][0])} ${f(points[i][1])} ${mid(points[i],points[(i+1)%n])}`;
    return d+'Z';
  }
  const period=1.48, stance=.645, stride=65, scale=1.095;
  const speed=stride*scale/(period*stance);
  function pose(L,cycle,bob){
    const p=(cycle+L.offset)%1, u=Math.max(0,(p-stance)/(1-stance));
    let dx=stride*(.5-p/stance),lift=0;
    if(p>=stance){
      const blend=u*u*(3-2*u), v=stride*(1-stance)/stance;
      dx=stride*(blend-.5)-v*u*(1-u)*(1-2*u);
      lift=(L.fore?26:22)*Math.sin(Math.PI*u)**2;
    }
    const x0=(L.fore?66:-87)+(L.far?9:0),y0=-157+bob;
    const fx=x0+dx+(L.fore?1:-3),fy=-lift;
    const ex=x0+(L.fore?-6:13)+dx*.18+(L.fore?3:8)*lift/25;
    const ey=-111+bob+lift*.09;
    const ax=fx-1,ay=fy-8,X=ax-ex,Y=ay-ey,dist=Math.hypot(X,Y);
    const a=L.fore?50:54,b=L.fore?55:57;
    const h=Math.min(dist-.1,(a*a-b*b+dist*dist)/(2*dist));
    const bend=(L.fore?1:-1)*Math.sqrt(Math.max(1.4,a*a-h*h));
    const kx=ex+(h*X+bend*Y)/dist,ky=ey+(h*Y-bend*X)/dist;
    const wx=ax+(kx-ax)*.17,wy=ay+(ky-ay)*.17;
    const center=[[x0,y0,L.fore?17:23],[ex,ey,L.fore?9:12],[kx,ky,L.fore?6:7],[wx,wy,3.6],[ax,ay,4.7],[fx,fy-3,4.5]];
    const left=[],right=[];
    for(let j=0;j<center.length;j++){
      const [x,y,r]=center[j],prev=center[Math.max(0,j-1)],next=center[Math.min(center.length-1,j+1)];
      const vx=next[0]-prev[0],vy=next[1]-prev[1],d=Math.hypot(vx,vy)||1;
      const nx=vy/d*r,ny=-vx/d*r;
      left.push([x-nx,y-ny]); right.push([x+nx,y+ny]);
      if(j===2){left.push([x-nx*.92+(wx-x)*.065,y-ny*.92+(wy-y)*.065]);right.push([x+nx*.92+(wx-x)*.065,y+ny*.92+(wy-y)*.065]);}
    }
    L.shape.setAttribute('d',smoothClosed(left.concat(right.reverse())));
    L.light.setAttribute('d',`M${f(kx+2)} ${f(ky+4)}Q${f(kx+(wx-kx)*.3+2)} ${f(ky+(wy-ky)*.3)} ${f(wx+2)} ${f(wy-1)}`);
    L.foot.setAttribute('transform',`translate(${f(fx)} ${f(fy)}) rotate(${f(20*Math.sin(tau*u)*Math.sin(Math.PI*u))} 0 -6)`);
    L.cast.setAttribute('cx',f(fx+3)); L.cast.setAttribute('opacity',f(.18*(1-lift/30)));
  }
  let t=0,last;
  const layers=[['pastureTiles',.25],['trailTiles',1],['bankTiles',1.21],['frontTiles',1.52]].map(([id,v])=>[by(id),v]);
  function frame(now){
    if(last!==undefined)t+=Math.min(.06,(now-last)/1000);
    last=now;
    const cycle=t/period+.08, ang=cycle*tau;
    const bob=1.75*Math.cos(2*ang-.25)+.48*Math.sin(ang);
    by('body').setAttribute('transform',`translate(${f(1.35*Math.sin(2*ang))} ${f(bob)}) rotate(${f(.7*Math.sin(ang-.4))} -10 -172)`);
    by('head').setAttribute('transform',`rotate(${f(1.6*Math.sin(ang+.2)+.8*Math.sin(2*ang-.7))} 79 -299)`);
    by('nearEar').setAttribute('transform',`rotate(${f(2.1*Math.sin(ang-.45))} 75 -313)`);
    by('farEar').setAttribute('transform',`rotate(${f(-2+2.8*Math.sin(ang-.9))} 95 -313)`);
    by('tail').setAttribute('transform',`rotate(${f(5*Math.sin(ang-.4))} -109 -204)`);
    for(const l of legs)pose(l,cycle,bob);
    for(const [layer,v] of layers)layer.setAttribute('transform',`translate(${f(-((t*speed*v)%1280))} 0)`);
    by('birds').setAttribute('transform',`translate(${f(13*Math.sin(t*.077))} ${f(3*Math.sin(t*.21))})`);
    by('wisps').setAttribute('transform',`translate(${f(16*Math.sin(t*.026))} 0)`);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
