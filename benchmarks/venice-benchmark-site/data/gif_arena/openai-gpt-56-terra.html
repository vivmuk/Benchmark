<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dancing Alpaca</title>
<style>
  :root {
    --ink: #4d3456;
    --cream: #fff1d7;
    --fur: #f7d7b2;
    --fur-light: #ffe9cc;
    --fur-shadow: #df9f8d;
    --pink: #ff759c;
    --mint: #83e5ca;
    --sky: #8bdcff;
    --gold: #ffd36f;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #8ad9f5;
  }

  body {
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
  }

  .scene {
    position: relative;
    width: min(100vw, 1100px);
    height: min(100vh, 760px);
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 16% 16%, rgba(255,255,255,.85) 0 3px, transparent 4px),
      radial-gradient(circle at 76% 10%, rgba(255,255,255,.7) 0 2px, transparent 3px),
      radial-gradient(circle at 91% 35%, rgba(255,255,255,.8) 0 3px, transparent 4px),
      linear-gradient(180deg, #7ed8f7 0%, #b7eff4 62%, #ffdca8 62%, #ffc98e 100%);
  }

  .sun {
    position: absolute;
    top: 7%;
    right: 10%;
    width: 112px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #fff1a6;
    box-shadow: 0 0 0 13px rgba(255, 241, 166, .22), 0 0 45px rgba(255, 235, 133, .7);
    animation: sunPulse 6s ease-in-out infinite;
  }

  .cloud {
    position: absolute;
    width: 175px;
    height: 45px;
    background: rgba(255,255,255,.72);
    border-radius: 100px;
    filter: drop-shadow(0 7px 3px rgba(76, 136, 157, .11));
    animation: cloudDrift 20s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: inherit;
  }
  .cloud::before { width: 72px; height: 72px; left: 28px; bottom: 6px; }
  .cloud::after { width: 92px; height: 92px; right: 22px; bottom: 2px; }
  .cloud.one { top: 17%; left: -80px; animation-delay: -8s; }
  .cloud.two { top: 38%; right: -95px; opacity: .65; transform: scale(.7); animation-delay: -2s; }

  .hills {
    position: absolute;
    left: -5%;
    bottom: 26%;
    width: 110%;
    height: 180px;
    background: #88dca8;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    box-shadow: 260px 34px 0 -30px #65ca93, -290px 44px 0 -28px #a2e6ad;
  }

  .floor {
    position: absolute;
    inset: auto 0 0;
    height: 29%;
    background:
      radial-gradient(ellipse at 11% 36%, #f6a16c 0 2px, transparent 3px),
      radial-gradient(ellipse at 83% 65%, #f6a16c 0 3px, transparent 4px),
      radial-gradient(ellipse at 68% 18%, #f6a16c 0 2px, transparent 3px),
      repeating-linear-gradient(105deg, transparent 0 45px, rgba(247,153,96,.12) 46px 48px),
      #ffd294;
  }

  .shadow {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 11%;
    width: 300px;
    height: 38px;
    border-radius: 50%;
    background: rgba(125, 73, 83, .22);
    transform: translateX(-50%);
    filter: blur(3px);
    animation: shadowDance 18s ease-in-out infinite;
  }

  .sparkles {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }

  .sparkle {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--c);
    clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
    animation: twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  .s1 { left: 24%; top: 32%; --c: #fff6a9; --d: 2.5s; --delay: -1.3s; }
  .s2 { left: 71%; top: 48%; --c: #ff78a5; --d: 2.2s; --delay: -.7s; }
  .s3 { left: 79%; top: 24%; --c: #fff; --d: 3s; --delay: -2s; transform: scale(.65); }
  .s4 { left: 18%; top: 59%; --c: #9effdd; --d: 2.7s; --delay: -1.8s; transform: scale(.8); }
  .s5 { left: 62%; top: 18%; --c: #fff6a9; --d: 2.1s; --delay: -1.1s; transform: scale(.65); }

  .alpaca-wrap {
    position: absolute;
    z-index: 4;
    width: min(460px, 68vw);
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    animation: wholeDance 18s cubic-bezier(.45,0,.55,1) infinite;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .outline {
    stroke: var(--ink);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .leg, .arm, .tail, .head-group, .ear-left, .ear-right, .neck-group, .body-group {
    transform-box: fill-box;
  }

  .leg.back-left { transform-origin: 50% 8%; animation: backLeft 18s ease-in-out infinite; }
  .leg.back-right { transform-origin: 50% 8%; animation: backRight 18s ease-in-out infinite; }
  .leg.front-left { transform-origin: 50% 8%; animation: frontLeft 18s ease-in-out infinite; }
  .leg.front-right { transform-origin: 50% 8%; animation: frontRight 18s ease-in-out infinite; }

  .arm.left { transform-origin: 50% 5%; animation: leftArm 18s ease-in-out infinite; }
  .arm.right { transform-origin: 50% 5%; animation: rightArm 18s ease-in-out infinite; }

  .tail { transform-origin: 4% 50%; animation: tailWag 1.15s ease-in-out infinite; }
  .body-group { transform-origin: 50% 75%; animation: bodySquish 18s ease-in-out infinite; }
  .neck-group { transform-origin: 50% 100%; animation: neckGroove 18s ease-in-out infinite; }
  .head-group { transform-origin: 50% 90%; animation: headGroove 18s ease-in-out infinite; }
  .ear-left { transform-origin: 50% 100%; animation: earWiggleLeft 1.6s ease-in-out infinite; }
  .ear-right { transform-origin: 50% 100%; animation: earWiggleRight 1.6s ease-in-out infinite .15s; }
  .cheek { transform-origin: center; animation: cheekPop 18s ease-in-out infinite; }
  .note { transform-box: fill-box; transform-origin: center; animation: noteFloat 3s ease-in-out infinite; }

  @keyframes wholeDance {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    4% { transform: translateX(-50%) translateY(-11px) rotate(-2deg); }
    8% { transform: translateX(-50%) translateY(0) rotate(1deg); }
    12% { transform: translateX(-50%) translateY(-18px) rotate(-3deg); }
    16% { transform: translateX(-50%) translateY(0) rotate(2deg); }
    21% { transform: translateX(-50%) translateY(-8px) rotate(0deg); }
    27% { transform: translateX(-50%) translateY(-15px) rotate(2deg); }
    33% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
    39% { transform: translateX(-50%) translateY(-22px) rotate(0deg) scale(1.025); }
    44% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    50% { transform: translateX(-50%) translateY(-12px) rotate(-3deg); }
    56% { transform: translateX(-50%) translateY(0) rotate(3deg); }
    62% { transform: translateX(-50%) translateY(-24px) rotate(-1deg); }
    68% { transform: translateX(-50%) translateY(0) rotate(1deg); }
    74% { transform: translateX(-50%) translateY(-10px) rotate(3deg); }
    81% { transform: translateX(-50%) translateY(0) rotate(-3deg); }
    88% { transform: translateX(-50%) translateY(-19px) rotate(2deg); }
    94% { transform: translateX(-50%) translateY(0) rotate(-1deg); }
  }

  @keyframes bodySquish {
    0%, 100% { transform: scale(1,1); }
    4%, 12%, 27%, 39%, 50%, 62%, 74%, 88% { transform: scale(1.035,.955); }
    8%, 16%, 33%, 44%, 56%, 68%, 81%, 94% { transform: scale(.97,1.035); }
  }

  @keyframes neckGroove {
    0%, 100% { transform: rotate(0deg); }
    12% { transform: rotate(-5deg); }
    27% { transform: rotate(5deg); }
    39% { transform: rotate(-7deg); }
    50% { transform: rotate(6deg); }
    62% { transform: rotate(-5deg); }
    74% { transform: rotate(6deg); }
    88% { transform: rotate(-4deg); }
  }

  @keyframes headGroove {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    4% { transform: rotate(7deg) translateY(-5px); }
    12% { transform: rotate(-9deg) translateY(-7px); }
    21% { transform: rotate(4deg); }
    33% { transform: rotate(-8deg) translateY(-2px); }
    39% { transform: rotate(11deg) translateY(-7px); }
    50% { transform: rotate(-10deg); }
    62% { transform: rotate(8deg) translateY(-6px); }
    74% { transform: rotate(-8deg); }
    88% { transform: rotate(9deg) translateY(-5px); }
  }

  @keyframes leftArm {
    0%, 100% { transform: rotate(12deg); }
    4% { transform: rotate(-55deg); }
    8% { transform: rotate(25deg); }
    12% { transform: rotate(-68deg); }
    16% { transform: rotate(18deg); }
    27% { transform: rotate(80deg); }
    33% { transform: rotate(-25deg); }
    39% { transform: rotate(95deg); }
    44% { transform: rotate(10deg); }
    50% { transform: rotate(-72deg); }
    56% { transform: rotate(15deg); }
    62% { transform: rotate(82deg); }
    68% { transform: rotate(-28deg); }
    74% { transform: rotate(95deg); }
    81% { transform: rotate(-55deg); }
    88% { transform: rotate(75deg); }
    94% { transform: rotate(12deg); }
  }

  @keyframes rightArm {
    0%, 100% { transform: rotate(-14deg); }
    4% { transform: rotate(46deg); }
    8% { transform: rotate(-25deg); }
    12% { transform: rotate(58deg); }
    16% { transform: rotate(-18deg); }
    27% { transform: rotate(-82deg); }
    33% { transform: rotate(20deg); }
    39% { transform: rotate(-96deg); }
    44% { transform: rotate(-12deg); }
    50% { transform: rotate(68deg); }
    56% { transform: rotate(-18deg); }
    62% { transform: rotate(-80deg); }
    68% { transform: rotate(23deg); }
    74% { transform: rotate(-92deg); }
    81% { transform: rotate(56deg); }
    88% { transform: rotate(-77deg); }
    94% { transform: rotate(-14deg); }
  }

  @keyframes frontLeft {
    0%, 100% { transform: rotate(3deg); }
    12% { transform: rotate(-22deg); }
    16% { transform: rotate(9deg); }
    27% { transform: rotate(28deg); }
    33% { transform: rotate(-10deg); }
    39% { transform: rotate(-30deg); }
    44% { transform: rotate(5deg); }
    62% { transform: rotate(32deg); }
    68% { transform: rotate(-12deg); }
    74% { transform: rotate(-26deg); }
    81% { transform: rotate(12deg); }
    88% { transform: rotate(27deg); }
  }

  @keyframes frontRight {
    0%, 100% { transform: rotate(-3deg); }
    12% { transform: rotate(19deg); }
    16% { transform: rotate(-8deg); }
    27% { transform: rotate(-25deg); }
    33% { transform: rotate(10deg); }
    39% { transform: rotate(29deg); }
    44% { transform: rotate(-5deg); }
    62% { transform: rotate(-29deg); }
    68% { transform: rotate(10deg); }
    74% { transform: rotate(25deg); }
    81% { transform: rotate(-11deg); }
    88% { transform: rotate(-28deg); }
  }

  @keyframes backLeft {
    0%, 100% { transform: rotate(-6deg); }
    8% { transform: rotate(13deg); }
    21% { transform: rotate(-14deg); }
    33% { transform: rotate(16deg); }
    44% { transform: rotate(-8deg); }
    56% { transform: rotate(17deg); }
    68% { transform: rotate(-15deg); }
    81% { transform: rotate(14deg); }
    94% { transform: rotate(-7deg); }
  }

  @keyframes backRight {
    0%, 100% { transform: rotate(6deg); }
    8% { transform: rotate(-13deg); }
    21% { transform: rotate(14deg); }
    33% { transform: rotate(-16deg); }
    44% { transform: rotate(8deg); }
    56% { transform: rotate(-17deg); }
    68% { transform: rotate(15deg); }
    81% { transform: rotate(-14deg); }
    94% { transform: rotate(7deg); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(27deg); }
  }

  @keyframes earWiggleLeft {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(8deg); }
  }

  @keyframes earWiggleRight {
    0%, 100% { transform: rotate(3deg); }
    50% { transform: rotate(-8deg); }
  }

  @keyframes cheekPop {
    0%, 100%, 44%, 68% { transform: scale(1); }
    39%, 62% { transform: scale(1.22); }
  }

  @keyframes shadowDance {
    0%, 100% { transform: translateX(-50%) scaleX(1); opacity: .22; }
    4%, 12%, 27%, 39%, 50%, 62%, 74%, 88% { transform: translateX(-50%) scaleX(.7); opacity: .13; }
  }

  @keyframes cloudDrift {
    from { transform: translateX(-50px); }
    to { transform: translateX(calc(100vw + 260px)); }
  }

  @keyframes sunPulse {
    50% { transform: scale(1.06); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.45) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
  }

  @keyframes noteFloat {
    0%, 100% { opacity: 0; transform: translate(0, 8px) rotate(-10deg) scale(.65); }
    20%, 75% { opacity: 1; }
    70% { transform: translate(20px, -70px) rotate(12deg) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="hills"></div>
  <div class="floor"></div>
  <div class="shadow"></div>

  <div class="sparkles" aria-hidden="true">
    <i class="sparkle s1"></i><i class="sparkle s2"></i><i class="sparkle s3"></i>
    <i class="sparkle s4"></i><i class="sparkle s5"></i>
  </div>

  <div class="alpaca-wrap" role="img" aria-label="A cheerful fluffy alpaca dancing">
    <svg viewBox="0 0 500 660" aria-hidden="true">
      <g class="note" style="animation-delay:-.2s">
        <circle cx="405" cy="185" r="10" fill="#ff759c"/>
        <path d="M414 181v-39l25-7v39" fill="none" stroke="#ff759c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="note" style="animation-delay:-1.6s">
        <circle cx="86" cy="276" r="8" fill="#6f75db"/>
        <path d="M94 272v-32l20-6v31" fill="none" stroke="#6f75db" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Tail behind body -->
      <g class="tail">
        <path class="outline" fill="#f7d7b2" d="M356 386c46-46 85-16 77 17-7 30-39 37-64 14 22 2 32-9 22-18-10-10-22-6-35 2z"/>
        <circle cx="399" cy="391" r="19" fill="#ffe9cc"/>
        <circle cx="419" cy="385" r="16" fill="#f7d7b2"/>
        <circle cx="410" cy="409" r="17" fill="#ffe9cc"/>
      </g>

      <!-- Rear legs -->
      <g class="leg back-left">
        <path class="outline" fill="#e5ac96" d="M172 459c-6 51-13 89-24 132-4 16 0 27 17 27h31c13 0 17-16 5-22l-13-6 18-120z"/>
        <path class="outline" fill="#fff1d7" d="M146 607c-7 13 1 22 19 22h36c13 0 16-17 4-22z"/>
      </g>
      <g class="leg back-right">
        <path class="outline" fill="#e5ac96" d="M313 458c8 48 16 93 28 133 5 17 1 28-17 28h-31c-13 0-17-16-5-22l13-6-20-121z"/>
        <path class="outline" fill="#fff1d7" d="M288 607c-7 13 1 22 19 22h37c12 0 16-17 3-22z"/>
      </g>

      <g class="body-group">
        <!-- Fluffy body -->
        <path class="outline" fill="#f7d7b2" d="M124 362
          c-27-12-37-49-13-70 9-8 21-11 32-10
          c-3-27 18-47 43-43 9-28 43-35 64-14
          c20-22 55-12 64 14 28-7 51 17 43 43
          c31 3 43 38 23 61 18 28 1 65-30 67
          c-8 34-47 49-74 31-30 19-67 2-74-29
          c-30 7-54-20-38-50z"/>
        <path d="M143 382c24 25 45 29 69 24M300 401c22-8 36-22 43-38" fill="none" stroke="#df9f8d" stroke-width="6" stroke-linecap="round" opacity=".65"/>
        <circle cx="164" cy="340" r="12" fill="#ffe9cc"/>
        <circle cx="202" cy="291" r="15" fill="#ffe9cc"/>
        <circle cx="313" cy="315" r="14" fill="#ffe9cc"/>
        <circle cx="342" cy="369" r="12" fill="#ffe9cc"/>

        <!-- Front legs -->
        <g class="leg front-left">
          <path class="outline" fill="#f7d7b2" d="M194 438c-4 53-3 105-2 153 0 17 8 25 24 25h21c13 0 17-16 5-22l-12-6 15-146z"/>
          <path class="outline" fill="#fff1d7" d="M190 606c-8 13 1 23 18 23h31c14 0 18-17 5-23z"/>
        </g>
        <g class="leg front-right">
          <path class="outline" fill="#f7d7b2" d="M278 439c6 50 9 102 9 151 0 17 8 25 24 25h21c13 0 17-16 5-22l-12-6-10-148z"/>
          <path class="outline" fill="#fff1d7" d="M285 606c-8 13 1 23 18 23h32c13 0 17-17 4-23z"/>
        </g>

        <!-- Left dancing arm -->
        <g class="arm left">
          <path class="outline" fill="#f7d7b2" d="M149 351c-31 22-54 53-69 81-6 12 1 23 13 20 12-4 27-21 39-39l37-35z"/>
          <path class="
