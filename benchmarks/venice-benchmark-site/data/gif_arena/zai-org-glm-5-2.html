<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dancing alpaca · 15s loop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #ffd6a5 0%, #ffb4a2 28%, #bde0fe 78%, #a2d2ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .scene {
      position: relative;
      width: 520px;
      height: 580px;
      background: rgba(255, 245, 215, 0.1);
      backdrop-filter: blur(2px);
      border-radius: 60px;
      box-shadow: 0 30px 40px -18px rgba(121, 75, 20, 0.4), inset 0 0 30px rgba(255, 255, 240, 0.25);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #fff2d8;
    }

    /* ground shadow and tiny confetti */
    .ground {
      position: absolute;
      bottom: 34px;
      left: 0;
      width: 100%;
      height: 32px;
      background: radial-gradient(ellipse, rgba(80, 40, 10, 0.28) 0%, transparent 70%);
      transform: scaleY(0.4);
      filter: blur(3px);
      z-index: 2;
    }

    .confetti {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(45deg, #ffddaa 0px, #ffddaa 8px, transparent 8px, transparent 20px);
      opacity: 0.2;
      mix-blend-mode: overlay;
    }

    /* ALPACA WRAPPER — bouncy body */
    .alpaca-dancer {
      position: relative;
      width: 240px;
      height: 300px;
      margin-bottom: 52px;
      z-index: 5;
      filter: drop-shadow(0 18px 10px rgba(92, 49, 26, 0.22));
      transform-origin: 50% 90%;
      animation: bounceBody 1.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }

    /* extra lilt also on legs/head? all parts are children */
    @keyframes bounceBody {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-14px) rotate(-2deg); }
      50%  { transform: translateY(2px) rotate(1.5deg); }
      75%  { transform: translateY(-8px) rotate(-1deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* main fluffy trunk */
    .alpaca {
      position: relative;
      width: 100%;
      height: 100%;
      background: #fff8ee;
      border-radius: 46% 46% 34% 34% / 42% 42% 28% 28%;
      box-shadow: 
        inset 20px 10px 25px rgba(255, 255, 255, 0.7),
        inset -12px -8px 18px rgba(198, 151, 118, 0.15),
        0 10px 0 #dfc8b2;
      background-image: radial-gradient(circle at 32% 28%, #ffffff 8px, transparent 9px),
                        radial-gradient(circle at 68% 38%, #ffffff 10px, transparent 11px),
                        radial-gradient(circle at 48% 68%, #efe3d4 14px, transparent 15px),
                        radial-gradient(circle at 78% 72%, #fff4e8 8px, transparent 9px),
                        radial-gradient(circle at 20% 82%, #ffe7d3 12px, transparent 13px);
      background-repeat: no-repeat;
      background-color: #fdf4e3;
    }

    /* fleece texture overlay */
    .alpaca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.6), transparent 40%),
                  radial-gradient(circle at 90% 70%, rgba(190, 140, 100, 0.12), transparent 40%);
      pointer-events: none;
    }

    /* long neck (goes behind head but above body) */
    .neck {
      position: absolute;
      top: -82px;
      left: 38px;
      width: 64px;
      height: 110px;
      background: linear-gradient(125deg, #fffdf2, #efdcc8);
      border-radius: 35% 35% 42% 42% / 28% 28% 20% 20%;
      transform: rotate(6deg);
      z-index: -0;
      box-shadow: inset -6px -8px 12px rgba(174, 123, 87, 0.12), inset 6px 2px 8px rgba(255,255,255,0.8);
    }
    .neck::after {
      content: '';
      position: absolute;
      top: 8px; left: 14px;
      width: 30px; height: 92px;
      background: #f8ede0;
      border-radius: 40%;
      opacity: 0.36;
      filter: blur(4px);
    }

    /* head */
    .head {
      position: absolute;
      top: -112px;
      left: 20px;
      width: 78px;
      height: 64px;
      background: #fffffa;
      border-radius: 42% 42% 40% 40% / 38% 38% 32% 32%;
      box-shadow: inset -6px -6px 10px rgba(184, 140, 100, 0.14), inset 5px 2px 10px white;
      transform: rotate(4deg);
      z-index: 3;
    }

    /* face fluff */
    .head::after {
      content: '';
      position: absolute;
      top: 10px; left: 12px;
      width: 40px; height: 20px;
      background: #fae8d8;
      border-radius: 50%;
      opacity: 0.28;
    }

    /* ears + inner ear */
    .ear {
      position: absolute;
      top: -27px;
      width: 26px;
      height: 34px;
      background: #fef4e2;
      border: 1px solid #dbb79b;
      border-radius: 80% 20% 60% 30% / 40% 18% 50% 50%;
      transform: rotate(-17deg);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.04));
    }
    .ear.left { left: 4px; }
    .ear.right { right: -2px; transform: rotate(15deg) scaleX(-1); }
    .ear::before {
      content: '';
      position: absolute;
      top: 5px; left: 7px;
      width: 12px; height: 16px;
      background: #e6b9a0;
      border-radius: 50% 20%;
      transform: rotate(5deg);
      opacity: 0.55;
    }

    /* cute face */
    .eye {
      position: absolute;
      top: 22px;
      width: 8px; height: 8px;
      background: #271f1b;
      border-radius: 50%;
      box-shadow: 0 0 3px #7a5139;
    }
    .eye.left { left: 18px; animation: blinkBlink 4s infinite; }
    .eye.right { right: 18px; animation: blinkBlink 4s infinite 0.2s; }
    @keyframes blinkBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%, 97% { transform: scaleY(0.1); }
    }

    .snout {
      position: absolute;
      bottom: 5px; left: 28px;
      width: 22px; height: 16px;
      background: #efd2c0;
      border-radius: 50%;
      border-bottom: 2px solid #d6a888;
    }
    .nose {
      position: absolute;
      bottom: 17px; left: 31px;
      width: 13px; height: 7px;
      background: #b48464;
      border-radius: 60%;
      box-shadow: inset 0 -1px 0px #6b3d2b;
      transform: rotate(-4deg);
    }
    .cheek {
      position: absolute;
      top: 32px;
      width: 16px; height: 7px;
      background: #ffc8b0;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.6;
    }
    .cheek.l { left: 6px; }
    .cheek.r { right: 6px; }

    /* LEGS (with mini hips) + animation */
    .legs {
      position: absolute;
      bottom: -18px;
      left: 36px;
      display: flex;
      gap: 34px;
    }
    .leg {
      width: 16px;
      height: 48px;
      background: #e9d2bb;
      border-radius: 10px 10px 30% 30% / 20% 20% 30% 30%;
      box-shadow: inset -3px -6px 0 #cba98d;
      transform-origin: top center;
      animation: legWave 1.6s ease-in-out infinite;
    }
    .leg.front { background: #f6e7d4; }
    .leg.back  { animation-delay: -0.8s; background: #f1deca; }
    .leg.front { animation-name: legFront; }
    .leg.back  { animation-name: legBack; }

    @keyframes legFront {
      0%   { transform: rotate(-26deg); }
      25%  { transform: rotate(17deg); }
      50%  { transform: rotate(13deg); }
      75%  { transform: rotate(-32deg); }
      100% { transform: rotate(-26deg); }
    }
    @keyframes legBack {
      0%   { transform: rotate(22deg); }
      25%  { transform: rotate(-24deg); }
      50%  { transform: rotate(-30deg); }
      75%  { transform: rotate(24deg); }
      100% { transform: rotate(22deg); }
    }

    /* ARM (small fluff limbs) */
    .arm {
      position: absolute;
      bottom: 24px;
      width: 25px;
      height: 42px;
      background: #faeada;
      border-radius: 50% 50% 40% 40% / 30% 30% 45% 45%;
      box-shadow: inset -3px -7px 0 #d7b69e;
      transform-origin: top center;
      filter: blur(0.2px);
      z-index: 6;
    }
    .arm.left { left: -8px; transform: rotate(-50deg); animation: armLeftWave 1.6s infinite; }
    .arm.right { right: -10px; transform: rotate(50deg); animation: armRightWave 1.6s infinite; }

    @keyframes armLeftWave {
      0%   { transform: rotate(-55deg); }
      20%  { transform: rotate(-10deg); }
      48%  { transform: rotate(-50deg); }
      68%  { transform: rotate(5deg); }
      100% { transform: rotate(-55deg); }
    }
    @keyframes armRightWave {
      0%   { transform: rotate(55deg); }
      20%  { transform: rotate(10deg); }
      48%  { transform: rotate(52deg); }
      68%  { transform: rotate(-5deg); }
      100% { transform: rotate(55deg); }
    }

    /* POM-POM TAIL (very fluffy, bobbing) */
    .tail {
      position: absolute;
      right: -26px;
      bottom: 24px;
      width: 38px;
      height: 38px;
      background: #fffdf7;
      border-radius: 50% 50% 45% 45%;
      box-shadow: 0 0 0 6px #fff3e0, 0 0 0 12px rgba(236, 204, 178, 0.3), 0 0 0 15px rgba(255, 255, 255, 0.2);
      background-image: radial-gradient(circle at 30% 35%, #ffffff 4px, transparent 5px),
      radial-gradient(circle at 63% 61%, #ffe4cc 5px, transparent 8px);
      transform-origin: left center;
      animation: tailWag 1.9s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes tailWag {
      0%   { transform: rotate(4deg) scale(1.0); }
      22%  { transform: rotate(-12deg) scale(1.15); }
      45%  { transform: rotate(8deg) scale(1.0); }
      70%  { transform: rotate(-7deg) scale(1.1); }
      100% { transform: rotate(4deg) scale(1); }
    }

    /* music note doodle */
    .music-note {
      position: absolute;
      top: 20px; left: 30px;
      font-size: 34px;
      color: #6d4b35;
      opacity: 0.3;
      animation: floatNote 3.2s infinite;
      text-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    @keyframes floatNote {
      0% { transform: translateY(0) rotate(4deg); }
      33% { transform: translateY(-14px) rotate(-6deg); }
      70% { transform: translateY(-5px) rotate(8deg); }
      100% { transform: translateY(0); }
    }

  </style>
</head>
<body>
  <div class="scene">
    <div class="ground"></div>
    <div class="confetti" style="background: repeating-linear-gradient(120deg, #ffdda9 0px, #ffdda9 12px, transparent 12px, transparent 22px); opacity: 0.2;"></div>
    <span class="music-note">♫ 🎵 🎶</span>

    <!-- █████ ALPACA DANCER █████ -->
    <div class="alpaca-dancer">
      <div class="alpaca">
        <!-- neck and head are children so they move with body -->
        <div class="neck"></div>
        <div class="head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek l"></div>
          <div class="cheek r"></div>
          <div class="snout"></div>
          <div class="nose"></div>
        </div>
        <!-- limbs -->
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="legs">
          <div class="leg front"></div>
          <div class="leg back"></div>
        </div>
        <div class="tail"></div>
      </div>
    </div>
  </div>

  <!-- tiny extra glitter (pure css, no img) -->
  <canvas id="starCanvas" style="position:fixed; inset:0; pointer-events:none; opacity:0.4;"></canvas>

  <script>
    // tiny canvas to add sparkle/star particles (all internal, no external)
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 42 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 3.5 + 1.8,
      speed: Math.random() * 0.25 + 0.08,
      drift: Math.random() * 0.5 - 0.25,
      phase: Math.random() * Math.PI * 2
    }));

    function twinkle() {
      ctx.clearRect(0, 0, w, h);
      const time = performance.now() / 500;
      for (const s of stars) {
        s.y += s.speed;
        s.x += s.drift;
        if (s.y > h + 12) { s.y = -12; s.x = Math.random() * w; }
        if (s.x < -8) s.x = w + 8;
        if (s.x > w + 8) s.x = -8;
        const opacity = 0.35 + 0.35 * Math.sin(time + s.phase);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 200, ${opacity})`;
        ctx.fill();
        // occasional shine
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(250, 220, 180, ${opacity * 0.18})`;
        ctx.fill();
      }
      requestAnimationFrame(twinkle);
    }
    twinkle();

    // additional tiny CSS loop: ensures >15 seconds visible (long term)
    console.log('🦙 long-neck boogie: 15+ sec forever loop, flame alive');
  </script>
</body>
</html>
