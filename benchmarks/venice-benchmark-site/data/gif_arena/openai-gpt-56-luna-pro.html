<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpaca Groove</title>
<style>
  :root {
    --night: #171838;
    --violet: #3a2867;
    --pink: #e875a3;
    --cream: #fff5dc;
    --wool: #fffaf0;
    --wool-shadow: #e9d9ca;
    --brown: #704653;
    --dark: #29203d;
    --gold: #ffd66e;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--night);
  }

  body {
    display: grid;
    place-items: center;
  }

  .scene {
    position: relative;
    width: min(100vw, 1100px);
    height: min(100vh, 760px);
    min-height: 520px;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 18%, #7252a3 0, #4c397e 24%, transparent 52%),
      linear-gradient(160deg, #272052 0%, #211c43 45%, #15152f 100%);
  }

  .scene::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .22;
    background-image:
      radial-gradient(circle, #fff 0 1px, transparent 1.6px),
      radial-gradient(circle, #ffd66e 0 1px, transparent 1.6px);
    background-size: 83px 97px, 127px 131px;
    background-position: 11px 18px, 45px 50px;
    animation: starDrift 18s linear infinite;
    z-index: -2;
  }

  .moon {
    position: absolute;
    width: 112px;
    height: 112px;
    right: 11%;
    top: 9%;
    border-radius: 50%;
    background: #fff6d7;
    box-shadow: 0 0 38px #ffe9a780, 0 0 90px #ffdb6955;
    opacity: .9;
  }

  .moon::after {
    content: "";
    position: absolute;
    width: 105px;
    height: 105px;
    left: 28px;
    top: -10px;
    border-radius: 50%;
    background: #4b397d;
  }

  .label {
    position: absolute;
    top: 28px;
    left: 38px;
    color: #fff6e6;
    letter-spacing: .16em;
    font-size: clamp(11px, 1.5vw, 15px);
    font-weight: 800;
    text-transform: uppercase;
    opacity: .8;
  }

  .label span {
    color: var(--gold);
    margin-left: 8px;
  }

  .music {
    position: absolute;
    color: #ffd96e;
    font-weight: 900;
    filter: drop-shadow(0 0 7px #ffd96e);
    animation: noteFloat 4s ease-in-out infinite;
    user-select: none;
  }

  .n1 { left: 19%; top: 25%; font-size: 34px; animation-delay: -.7s; }
  .n2 { right: 23%; top: 37%; font-size: 25px; animation-delay: -2.1s; color: #ff9bbb; }
  .n3 { left: 29%; top: 48%; font-size: 20px; animation-delay: -1.3s; color: #a6e6ff; }
  .n4 { right: 15%; top: 62%; font-size: 31px; animation-delay: -3s; }

  .floor-glow {
    position: absolute;
    width: 65%;
    height: 105px;
    left: 17.5%;
    bottom: 11%;
    border-radius: 50%;
    background: #c75d9b;
    filter: blur(33px);
    opacity: .38;
    animation: glowPulse 1.2s ease-in-out infinite alternate;
  }

  svg {
    position: absolute;
    width: min(93%, 780px);
    height: 82%;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    overflow: visible;
  }

  .ground {
    fill: #1b1733;
    stroke: #5b3a78;
    stroke-width: 4;
  }

  .ground-line {
    fill: none;
    stroke: #9e5e9e;
    stroke-width: 3;
    stroke-linecap: round;
    opacity: .55;
  }

  .alpaca {
    transform-origin: 50% 78%;
    animation: wholeDance 16s ease-in-out infinite;
  }

  .body-bounce {
    transform-origin: 50% 61%;
    animation: bodyBounce 1.2s ease-in-out infinite;
  }

  .body-shadow {
    fill: #b86e9d;
    opacity: .32;
    filter: blur(4px);
    animation: shadowBounce 1.2s ease-in-out infinite;
  }

  .body {
    fill: url(#woolGradient);
    stroke: #b98483;
    stroke-width: 3;
  }

  .wool-lump {
    fill: var(--wool);
    stroke: #dcbdb3;
    stroke-width: 2;
  }

  .wool-shade {
    fill: var(--wool-shadow);
    opacity: .68;
  }

  .neck {
    fill: url(#neckGradient);
    stroke: #b98483;
    stroke-width: 3;
  }

  .neck-fluff {
    fill: var(--wool);
    stroke: #dcbdb3;
    stroke-width: 2;
  }

  .head {
    transform-origin: 73% 28%;
    animation: headGroove 1.2s ease-in-out infinite;
  }

  .face {
    fill: #fff9e9;
    stroke: #b98483;
    stroke-width: 3;
  }

  .muzzle {
    fill: #edc8bd;
    stroke: #b98483;
    stroke-width: 2;
  }

  .ear {
    fill: #fff8e9;
    stroke: #b98483;
    stroke-width: 3;
  }

  .ear-inner {
    fill: #eaa7af;
    opacity: .7;
  }

  .eye {
    fill: #30233b;
  }

  .eye-shine {
    fill: white;
  }

  .cheek {
    fill: #f19aa8;
    opacity: .68;
  }

  .smile {
    fill: none;
    stroke: #704653;
    stroke-width: 2.4;
    stroke-linecap: round;
  }

  .leg {
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }

  .leg-fill {
    fill: url(#legGradient);
    stroke: #b98483;
    stroke-width: 3;
  }

  .hoof {
    fill: #63405a;
    stroke: #3b2946;
    stroke-width: 2;
  }

  .leg-back { animation: backLeg 1.2s ease-in-out infinite; }
  .leg-front { animation: frontLeg 1.2s ease-in-out infinite; animation-delay: -.6s; }
  .leg-wave { animation: wavingLeg 2.4s ease-in-out infinite; }

  .tail {
    transform-origin: 20% 55%;
    animation: tailWag 1.2s ease-in-out infinite;
  }

  .tail-pom {
    fill: var(--wool);
    stroke: #dcbdb3;
    stroke-width: 3;
  }

  .sparkle {
    fill: var(--gold);
    animation: sparkle 2.3s ease-in-out infinite;
  }

  .sparkle.s2 { animation-delay: -1.1s; fill: #ff9bbb; }
  .sparkle.s3 { animation-delay: -.5s; fill: #9ce5ff; }

  @keyframes wholeDance {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    12% { transform: translateY(4px) rotate(2deg); }
    25% { transform: translateY(-5px) rotate(-2deg); }
    38% { transform: translateY(3px) rotate(2deg); }
    50% { transform: translateY(-7px) rotate(-1deg); }
    63% { transform: translateY(4px) rotate(2deg); }
    75% { transform: translateY(-3px) rotate(-2deg); }
    88% { transform: translateY(3px) rotate(1deg); }
  }

  @keyframes bodyBounce {
    0%, 100% { transform: translateY(0) scaleY(1); }
    25% { transform: translateY(5px) scaleY(.98); }
    50% { transform: translateY(-8px) scaleY(1.025); }
    75% { transform: translateY(4px) scaleY(.99); }
  }

  @keyframes shadowBounce {
    0%, 100% { transform: scaleX(1); opacity: .32; }
    50% { transform: scaleX(.84); opacity: .2; }
  }

  @keyframes headGroove {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(5deg) translateY(2px); }
    50% { transform: rotate(-5deg) translateY(-4px); }
    75% { transform: rotate(4deg) translateY(1px); }
  }

  @keyframes backLeg {
    0%, 100% { transform: rotate(7deg); }
    25% { transform: rotate(-10deg); }
    50% { transform: rotate(13deg); }
    75% { transform: rotate(-5deg); }
  }

  @keyframes frontLeg {
    0%, 100% { transform: rotate(-8deg); }
    25% { transform: rotate(14deg); }
    50% { transform: rotate(-13deg); }
    75% { transform: rotate(8deg); }
  }

  @keyframes wavingLeg {
    0%, 100% { transform: rotate(5deg); }
    20% { transform: rotate(-28deg); }
    40% { transform: rotate(23deg); }
    60% { transform: rotate(-18deg); }
    80% { transform: rotate(12deg); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(17deg); }
    50% { transform: rotate(-15deg); }
    75% { transform: rotate(13deg); }
  }

  @keyframes noteFloat {
    0%, 100% { transform: translateY(0) rotate(-8deg); opacity: .5; }
    50% { transform: translateY(-25px) rotate(12deg); opacity: 1; }
  }

  @keyframes sparkle {
    0%, 100% { opacity: .1; transform: scale(.5) rotate(0); }
    45% { opacity: 1; transform: scale(1.15) rotate(45deg); }
    70% { opacity: .25; transform: scale(.7) rotate(90deg); }
  }

  @keyframes glowPulse {
    from { transform: scaleX(.9); opacity: .27; }
    to { transform: scaleX(1.07); opacity: .48; }
  }

  @keyframes starDrift {
    from { background-position: 11px 18px, 45px 50px; }
    to { background-position: 94px 115px, -82px 181px; }
  }

  @media (max-width: 600px) {
    .scene { min-height: 480px; }
    .moon { width: 78px; height: 78px; right: 8%; }
    .moon::after { width: 74px; height: 74px; left: 20px; top: -8px; }
    .label { left: 20px; top: 20px; }
    svg { height: 78%; bottom: 10%; }
    .n1 { left: 8%; }
    .n4 { right: 7%; }
  }
</style>
</head>
<body>
<main class="scene" aria-label="A cute alpaca dancing under the moon">
  <div class="label">Alpaca <span>Groove ♪</span></div>
  <div class="moon"></div>
  <div class="music n1">♪</div>
  <div class="music n2">♫</div>
  <div class="music n3">•</div>
  <div class="music n4">♩</div>
  <div class="floor-glow"></div>

  <svg viewBox="0 0 800 620" role="img" aria-label="Fluffy alpaca doing a joyful dance">
    <defs>
      <linearGradient id="woolGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffdf4"/>
        <stop offset=".72" stop-color="#f8e9da"/>
        <stop offset="1" stop-color="#e6c9c5"/>
      </linearGradient>
      <linearGradient id="neckGradient" x1="0" y1="0" x2="1" y2="0">
        <stop stop-color="#f7e6d9"/>
        <stop offset=".55" stop-color="#fffaf0"/>
        <stop offset="1" stop-color="#e9c9c3"/>
      </linearGradient>
      <linearGradient id="legGradient" x1="0" y1="0" x2="1" y2="0">
        <stop stop-color="#fff8eb"/>
        <stop offset="1" stop-color="#e7c6c3"/>
      </linearGradient>
      <filter id="softShadow">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
    </defs>

    <ellipse class="ground" cx="400" cy="555" rx="250" ry="25"/>
    <path class="ground-line" d="M160 555 Q230 538 300 554 T450 554 T620 551"/>
    <ellipse class="body-shadow" cx="400" cy="550" rx="155" ry="20"/>

    <g class="alpaca">
      <!-- back legs -->
      <g class="leg leg-back" transform="translate(315 409)">
        <path class="leg-fill" d="M0 0 C-8 45 -8 83 -4 118 L35 118 C39 76 38 37 31 -2Z"/>
        <path class="hoof" d="M-5 108 Q15 101 38 111 L42 126 Q17 135 -7 124Z"/>
      </g>
      <g class="leg leg-back" transform="translate(425 411)">
        <path class="leg-fill" d="M0 0 C-3 44 1 83 10 119 L48 119 C48 78 43 35 35 -2Z"/>
        <path class="hoof" d="M7 109 Q28 103 50 112 L52 126 Q27 134 6 125Z"/>
      </g>

      <!-- tail -->
      <g class="tail">
        <path d="M217 365 Q168 344 180 302" fill="none" stroke="#fff6e9" stroke-width="24" stroke-linecap="round"/>
        <circle class="tail-pom" cx="181" cy="295" r="29"/>
        <circle class="wool-shade" cx="169" cy="284" r="9"/>
        <circle class="wool-shade" cx="194" cy="305" r="8"/>
      </g>

      <g class="body-bounce">
        <!-- big fluffy body -->
        <path class="body" d="M205 365
          C193 327 216 286 260 273
          C286 238 346 239 376 265
          C418 239 477 259 482 301
          C526 319 529 365 505 395
          C514 437 469 467 429 458
          C391 487 337 478 313 451
          C270 467 222 438 228 403
          C202 395 192 381 205 365Z"/>
        <!-- wool scallops -->
        <circle class="wool-lump" cx="244" cy="311" r="28"/>
        <circle class="wool-lump" cx="286" cy="277" r="31"/>
        <circle class="wool-lump" cx="338" cy="270" r="29"/>
        <circle class="wool-lump" cx="394" cy="280" r="31"/>
        <circle class="wool-lump" cx="452" cy="313" r="30"/>
        <circle class="wool-lump" cx="477" cy="363" r="28"/>
        <circle class="wool-lump" cx="453" cy="418" r="31"/>
        <circle class="wool-lump" cx="400" cy="442" r="30"/>
        <circle class="wool-lump" cx="339" cy="438" r="31"/>
        <circle class="wool-lump" cx="278" cy="420" r="29"/>
        <circle class="wool-lump" cx="235" cy="378" r="28"/>
        <path class="wool-shade" d="M245 390 Q342 450 453 398 Q441 449 390 454 Q307 470 260 426Z"/>

        <!-- long neck -->
        <path class="neck" d="M414 291 C421 238 421 174 438 126
          C449 96 493 95 507 124 C519 154 505 204 501 280
          C492 311 438 322 414 291Z"/>
        <path class="neck-fluff" d="M430 276 Q416 250 431 227 Q414 201 432 179
          Q418 151 438 128 Q451 103 475 111 Q494 115 503 137
          Q486 161 497 184 Q479 210 492 232 Q475 267 484 292
          Q456 311 430 276Z"/>
        <circle class="wool-shade" cx="447" cy="166" r="11"/>
        <circle class="wool-shade" cx="461" cy="219" r="12"/>
      </g>

      <!-- waving front legs -->
      <g class="leg leg-front leg-wave" transform="translate(454 402)">
        <path class="leg-fill" d="M0 0 C-12 41 -18 79 -10 116 L27 122 C34 81 38 39 32 -2Z"/>
        <path class="hoof" d="M-12 110 Q7 103 30 112 L34 128 Q8 136 -14 125Z"/>
      </g>
      <g class="leg leg-front" transform="translate(383 414)">
        <path class="leg-fill" d="M0 0 C-7 39 -7 78 -1 118 L36 119 C39 79 36 39 29 -2Z"/>
        <path class="hoof" d="M-2 108 Q18 102 39 111 L42 126 Q19 134 -3 125Z"/>
      </g>

      <!-- head -->
      <g class="head">
        <path class="ear" d="M443 119 Q412 78 425 45 Q434 26 452 47 L478 101Z"/>
        <path class="ear-inner" d="M439 85 Q427 58 437 48 Q445 45 461 86Z"/>
        <path class="ear" d="M493 104 Q510 58 540 52 Q558 52 546 76 L519 124Z"/>
        <path class="ear-inner" d="M513 99 Q524 72 540 67 Q544 69 518 112Z"/>

        <path class="face" d="M434 78 Q457 49 502 62 Q545 75 548 116
          Q551 153 518 171 Q482 190 449 164 Q420 142 426 106Z"/>
        <circle class="wool-lump" cx="449" cy="76" r="21"/>
        <circle class="wool-lump" cx="478" cy="64" r="22"/>
        <circle class="wool-lump" cx="509" cy="76" r="21"/>
        <path class="muzzle" d="M489 125 Q515 112 537 128 Q548 140 535 155
          Q512 173 489 157 Q479 143 489 125Z"/>
        <ellipse class="eye" cx="475" cy="105" rx="7" ry="9"/>
        <circle class="eye-shine" cx="478" cy="102" r="2.5"/>
        <ellipse class="eye" cx="523" cy="111" rx="6" ry="8"/>
        <circle class="eye-shine" cx="525" cy="108" r="2.2"/>
        <circle class="cheek" cx="451" cy="128" r="9"/>
        <circle class="cheek" cx="538" cy="132" r="8"/>
        <path class="smile" d="M503 145 Q512 151 521 144"/>
        <ellipse fill="#704653" cx="515" cy="132" rx="5" ry="3.5"/>
      </g>
    </g>

    <g aria-hidden="true">
      <path class="sparkle" d="M145 241 l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
      <path class="sparkle s2" d="M632 238 l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
      <path class="sparkle s3" d="M602 437 l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
    </g>
  </svg>
</main>
</body>
</html>
