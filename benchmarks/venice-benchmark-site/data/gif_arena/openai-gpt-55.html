<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dancing Alpaca</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.75) 0 5%, transparent 16%),
      radial-gradient(circle at 85% 20%, rgba(255,221,245,.65) 0 4%, transparent 15%),
      linear-gradient(180deg, #8de7ff 0%, #bda3ff 47%, #ffd0e8 100%);
  }

  body {
    display: grid;
    place-items: center;
  }

  .poster {
    position: relative;
    width: min(100vw, 980px);
    height: min(100vh, 720px);
    overflow: hidden;
    border-radius: 28px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.55), transparent 28%),
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.28),
      0 30px 80px rgba(76, 47, 133, .32);
  }

  .sun {
    position: absolute;
    width: 118px;
    height: 118px;
    left: 7%;
    top: 8%;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7a8 0 45%, #ffc95d 46% 70%, transparent 71%);
    filter: drop-shadow(0 0 26px rgba(255,228,111,.8));
    animation: sunPulse 6s ease-in-out infinite;
  }

  .cloud {
    position: absolute;
    width: 160px;
    height: 54px;
    border-radius: 99px;
    background: rgba(255,255,255,.72);
    filter: blur(.2px);
    animation: cloudDrift 18s linear infinite;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.78);
  }

  .cloud::before {
    width: 74px;
    height: 74px;
    left: 23px;
    top: -34px;
  }

  .cloud::after {
    width: 88px;
    height: 88px;
    right: 18px;
    top: -45px;
  }

  .cloud.one { left: -190px; top: 14%; animation-delay: -2s; }
  .cloud.two { left: -240px; top: 28%; transform: scale(.72); animation-delay: -11s; opacity: .65; }

  .floor {
    position: absolute;
    left: 50%;
    bottom: 35px;
    width: 84%;
    height: 185px;
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,.42) 0 15%, rgba(255,255,255,.16) 42%, transparent 68%),
      radial-gradient(ellipse at center, rgba(108,73,166,.3), transparent 70%);
    animation: floorGlow 3s ease-in-out infinite;
  }

  .spotlight {
    position: absolute;
    left: 50%;
    bottom: 85px;
    width: 620px;
    height: 620px;
    transform: translateX(-50%);
    background: conic-gradient(from 180deg at 50% 100%, transparent 0deg, rgba(255,255,255,.23) 23deg, transparent 52deg, transparent 308deg, rgba(255,255,255,.2) 337deg, transparent 360deg);
    filter: blur(2px);
    opacity: .8;
    animation: spotlightSweep 9s ease-in-out infinite;
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(83, 45, 139, .88);
    font-weight: 900;
    letter-spacing: .035em;
    font-size: clamp(24px, 4vw, 46px);
    text-shadow:
      0 2px 0 rgba(255,255,255,.55),
      0 12px 24px rgba(83,45,139,.16);
    animation: titleBounce 4.5s ease-in-out infinite;
    white-space: nowrap;
  }

  .sparkle,
  .note {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .sparkle {
    width: 13px;
    height: 13px;
    background: #fff;
    clip-path: polygon(50% 0%, 61% 35%, 100% 50%, 61% 65%, 50% 100%, 39% 65%, 0% 50%, 39% 35%);
    filter: drop-shadow(0 0 8px rgba(255,255,255,.95));
    opacity: 0;
    animation: sparkleFloat 5s ease-in-out infinite;
  }

  .note {
    font-size: 34px;
    color: #6c35c7;
    text-shadow: 0 4px 0 rgba(255,255,255,.38);
    opacity: 0;
    animation: noteFloat 7.5s ease-in-out infinite;
  }

  .note.n1 { left: 14%; bottom: 235px; animation-delay: -1.2s; }
  .note.n2 { right: 16%; bottom: 275px; animation-delay: -3.7s; color: #ff5ebc; }
  .note.n3 { left: 72%; bottom: 155px; animation-delay: -5.8s; color: #22aee8; }

  .alpaca-wrap {
    position: absolute;
    left: 50%;
    bottom: 74px;
    width: min(76vw, 580px);
    height: min(76vw, 580px);
    transform: translateX(-50%);
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .alpaca {
    transform-box: fill-box;
    transform-origin: 50% 82%;
    animation: alpacaTravel 18s cubic-bezier(.45,0,.55,1) infinite;
  }

  .whole {
    transform-box: fill-box;
    transform-origin: 50% 74%;
    animation: wholeGroove 1.5s ease-in-out infinite;
  }

  .body {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: bodyBounce 1.5s ease-in-out infinite;
  }

  .neck {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: neckSway 3s ease-in-out infinite;
  }

  .head {
    transform-box: fill-box;
    transform-origin: 48% 78%;
    animation: headBop 1.5s ease-in-out infinite;
  }

  .ear-left {
    transform-box: fill-box;
    transform-origin: 80% 100%;
    animation: earWiggleLeft 1.5s ease-in-out infinite;
  }

  .ear-right {
    transform-box: fill-box;
    transform-origin: 20% 100%;
    animation: earWiggleRight 1.5s ease-in-out infinite;
  }

  .tail {
    transform-box: fill-box;
    transform-origin: 12% 50%;
    animation: tailWag .75s ease-in-out infinite;
  }

  .leg {
    transform-box: fill-box;
    transform-origin: 50% 6%;
  }

  .front-left { animation: legKickA 1.5s ease-in-out infinite; }
  .front-right { animation: legKickB 1.5s ease-in-out infinite; }
  .back-left { animation: legKickB 1.5s ease-in-out infinite; }
  .back-right { animation: legKickA 1.5s ease-in-out infinite; }

  .hoof {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: hoofTap .75s ease-in-out infinite;
  }

  .scarf {
    transform-box: fill-box;
    transform-origin: 26% 20%;
    animation: scarfFlutter 1.5s ease-in-out infinite;
  }

  .cheek {
    animation: cheekPulse 1.5s ease-in-out infinite;
  }

  .eye {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 6s infinite;
  }

  .mouth {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: smileDance 1.5s ease-in-out infinite;
  }

  .fluff {
    transform-box: fill-box;
    transform-origin: center;
    animation: fluffJiggle 1.5s ease-in-out infinite;
  }

  .fluff:nth-of-type(2n) { animation-delay: -.25s; }
  .fluff:nth-of-type(3n) { animation-delay: -.5s; }

  .shadow {
    animation: shadowSquish 1.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .confetti {
    transform-box: fill-box;
    transform-origin: center;
    animation: confettiFall 9s linear infinite;
  }

  .confetti.c2 { animation-delay: -2s; }
  .confetti.c3 { animation-delay: -4s; }
  .confetti.c4 { animation-delay: -6s; }

  @keyframes sunPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.06) rotate(8deg); }
  }

  @keyframes cloudDrift {
    from { transform: translateX(0) scale(var(--s,1)); }
    to { transform: translateX(calc(100vw + 380px)) scale(var(--s,1)); }
  }

  @keyframes floorGlow {
    0%, 100% { transform: translateX(-50%) scaleX(1); opacity: .85; }
    50% { transform: translateX(-50%) scaleX(1.08); opacity: 1; }
  }

  @keyframes spotlightSweep {
    0%, 100% { transform: translateX(-50%) rotate(-7deg); opacity: .68; }
    50% { transform: translateX(-50%) rotate(7deg); opacity: .9; }
  }

  @keyframes titleBounce {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(-1deg); }
    50% { transform: translateX(-50%) translateY(8px) rotate(1deg); }
  }

  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(30px) scale(.4) rotate(0deg); }
    20%, 70% { opacity: .95; }
    100% { opacity: 0; transform: translateY(-90px) scale(1.15) rotate(180deg); }
  }

  @keyframes noteFloat {
    0% { opacity: 0; transform: translate(0, 40px) rotate(-10deg) scale(.75); }
    15% { opacity: .95; }
    55% { transform: translate(18px, -65px) rotate(13deg) scale(1.05); }
    100% { opacity: 0; transform: translate(-10px, -135px) rotate(-18deg) scale(.75); }
  }

  @keyframes alpacaTravel {
    0% { transform: translateX(0) rotate(0deg); }
    8% { transform: translateX(-26px) rotate(-2deg); }
    16% { transform: translateX(18px) rotate(2.5deg); }
    25% { transform: translateX(0) rotate(0deg); }
    34% { transform: translateX(38px) rotate(3deg); }
    43% { transform: translateX(-20px) rotate(-2deg); }
    50% { transform: translateX(0) rotate(0deg); }
    58% { transform: translateX(-46px) rotate(-3deg); }
    67% { transform: translateX(26px) rotate(2deg); }
    75% { transform: translateX(0) rotate(0deg); }
    84% { transform: translateX(30px) rotate(-1.5deg); }
    92% { transform: translateX(-22px) rotate(1.5deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }

  @keyframes wholeGroove {
    0%, 100% { transform: translateY(0) scaleY(1); }
    25% { transform: translateY(-18px) scaleY(1.02); }
    50% { transform: translateY(4px) scaleY(.985); }
    75% { transform: translateY(-12px) scaleY(1.015); }
  }

  @keyframes bodyBounce {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-2deg) scale(1.018,.982); }
    50% { transform: rotate(0deg) scale(.985,1.025); }
    75% { transform: rotate(2deg) scale(1.018,.982); }
  }

  @keyframes neckSway {
    0%, 100% { transform: rotate(-4deg); }
    25% { transform: rotate(5deg); }
    50% { transform: rotate(8deg); }
    75% { transform: rotate(-7deg); }
  }

  @keyframes headBop {
    0%, 100% { transform: translateY(0) rotate(2deg); }
    25% { transform: translateY(-9px) rotate(-8deg); }
    50% { transform: translateY(2px) rotate(3deg); }
    75% { transform: translateY(-7px) rotate(8deg); }
  }

  @keyframes earWiggleLeft {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(-16deg); }
    70% { transform: rotate(8deg); }
  }

  @keyframes earWiggleRight {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(16deg); }
    70% { transform: rotate(-8deg); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-16deg) scale(1); }
    50% { transform: rotate(22deg) scale(1.08); }
  }

  @keyframes legKickA {
    0%, 100% { transform: rotate(8deg); }
    25% { transform: rotate(-18deg) translateY(-8px); }
    50% { transform: rotate(6deg); }
    75% { transform: rotate(18deg) translateY(-3px); }
  }

  @keyframes legKickB {
    0%, 100% { transform: rotate(-10deg); }
    25% { transform: rotate(18deg) translateY(-2px); }
    50% { transform: rotate(-7deg); }
    75% { transform: rotate(-22deg) translateY(-9px); }
  }

  @keyframes hoofTap {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(1.25); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(24deg) scale(1.08); }
  }

  @keyframes scarfFlutter {
    0%, 100% { transform: rotate(5deg) translateY(0); }
    50% { transform: rotate(-14deg) translateY(-5px); }
  }

  @keyframes cheekPulse {
    0%, 100% { opacity: .72; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.13); }
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    94%, 96% { transform: scaleY(.08); }
  }

  @keyframes smileDance {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(2px) scaleX(1.1); }
  }

  @keyframes fluffJiggle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @keyframes shadowSquish {
    0%, 100% { transform: scaleX(1); opacity: .28; }
    25%, 75% { transform: scaleX(.82); opacity: .18; }
    50% { transform: scaleX(1.15); opacity: .34; }
  }

  @keyframes confettiFall {
    0% { transform: translateY(-230px) rotate(0deg); opacity: 0; }
    10%, 80% { opacity: .9; }
    100% { transform: translateY(460px) rotate(500deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 20s !important;
    }
  }
</style>
</head>
<body>
  <main class="poster" aria-label="A cute fluffy alpaca dancing in a colorful animated scene">
    <div class="sun"></div>
    <div class="cloud one"></div>
    <div class="cloud two" style="--s:.72"></div>
    <div class="spotlight"></div>
    <div class="title">Alpaca Dance Party!</div>

    <div class="sparkle" style="left:10%; top:52%; animation-delay:-.4s"></div>
    <div class="sparkle" style="left:23%; top:33%; animation-delay:-2.1s"></div>
    <div class="sparkle" style="right:18%; top:38%; animation-delay:-1.3s"></div>
    <div class="sparkle" style="right:8%; top:58%; animation-delay:-3.2s"></div>
    <div class="sparkle" style="left:52%; top:17%; animation-delay:-4.1s"></div>

    <div class="note n1">♪</div>
    <div class="note n2">♫</div>
    <div class="note n3">♬</div>
    <div class="floor"></div>

    <div class="alpaca-wrap">
      <svg viewBox="0 0 620 620" role="img" aria-label="Animated fluffy alpaca dancing">
        <defs>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3d2168" flood-opacity=".22"/>
          </filter>
          <filter id="fluffyGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7a4f99" flood-opacity=".14"/>
          </filter>
          <linearGradient id="cream" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fffaf0"/>
            <stop offset=".55" stop-color="#f6e9d0"/>
            <stop offset="1" stop-color="#e9d1af"/>
          </linearGradient>
          <linearGradient id="wool" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fffdf4"/>
            <stop offset=".6" stop-color="#f3dfbf"/>
            <stop offset="1" stop-color="#ddbd92"/>
          </linearGradient>
          <linearGradient id="hoof" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#8a5b4a"/>
            <stop offset="1" stop-color="#573225"/>
          </linearGradient>
          <linearGradient id="scarfGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#ff4ba2"/>
            <stop offset="1" stop-color="#7a45ff"/>
          </linearGradient>
        </defs>

        <ellipse class="shadow" cx="314" cy="545" rx="164" ry="34" fill="#583284"/>

        <g class="confetti c1">
          <rect x="80" y="68" width="13" height="28" rx="4" fill="#ffeb5c"/>
          <circle cx="532" cy="44" r="8" fill="#ff5ebc"/>
          <rect x="480" y="120" width="14" height="22" rx="4" fill="#6ef2d2"/>
        </g>
        <g class="confetti c2">
          <rect x="145" y="20" width="12" height="24" rx="4" fill="#22aee8"/>
          <circle cx="420" cy="4" r="7" fill="#fff176"/>
          <rect x="566" y="82" width="11" height="28" rx="4" fill="#ff7e67"/>
        </g>
        <g class="confetti c3">
          <circle cx="54" cy="12" r="7" fill="#b268ff"/>
          <rect x="245" y="44" width="12" height="26" rx="4" fill="#ff5ebc"/>
          <rect x="350" y="92" width="15" height="18" rx="4" fill="#72ff89"/>
        </g>
        <g class="confetti c4">
          <circle cx="595" cy="20" r="7" fill="#6ef2d2"/>
          <rect x="31" y="126" width="12" height="26" rx="4" fill="#ff9f43"/>
          <rect x="300" y="-2" width="12" height="24" rx="4" fill="#ffffff"/>
        </g>

        <g class="alpaca" filter="url(#softShadow)">
          <g class="whole">
            <g class="leg back-left">
              <path d="M227 407 C220 438 218 480 229 516 C233 531 255 530 258 515 C263 479 258 442 265 413 Z" fill="url(#cream)"/>
              <ellipse class="hoof" cx="244" cy="524" rx="26" ry="13" fill="url(#hoof)"/>
            </g>
            <g class="leg back-right">
              <path d="M385 405 C392 438 394 478 382 516 C378 531 356 530 353 515 C348 478 353 442 345 413 Z" fill="url(#cream)"/>
              <ellipse class="hoof" cx="365" cy="524" rx="26" ry="13" fill="url(#hoof)"/>
            </g>

            <g class="tail">
              <circle cx="460" cy="361" r="23" fill="url(#wool)" filter="url(#fluffyGlow)"/>
              <circle cx="475" cy="354" r="20" fill="#fff8ea"/>
              <circle cx="477" cy="376" r="18" fill="#efd4ab"/>
              <circle cx="451" cy="378" r="17" fill="#fff4dc"/>
            </g>

            <g class="body" filter="url(#fluffyGlow)">
              <ellipse cx="310" cy="366" rx="139" ry="102" fill="url(#wool)"/>
              <circle class="fluff" cx="196" cy="328" r="38" fill="#fff8e8"/>
              <circle class="fluff" cx="234" cy="290" r="43" fill="#fffaf0"/>
              <circle class="fluff" cx="292" cy="
