<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dancing Alpaca</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  body {
    background: linear-gradient(180deg, #ffd6e8 0%, #ffe9c7 45%, #c8f0d8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Background twinkle stars */
  .sky {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    color: #fff;
    font-size: 20px;
    opacity: .8;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { transform: scale(.6); opacity:.3; }
    50% { transform: scale(1.3); opacity:1; }
  }

  /* rotating disco glow */
  .glow {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(255,120,200,.25), rgba(120,200,255,.25),
      rgba(255,220,120,.25), rgba(180,120,255,.25),
      rgba(255,120,200,.25));
    filter: blur(30px);
    animation: spinGlow 12s linear infinite;
    z-index: 0;
  }
  @keyframes spinGlow { to { transform: rotate(360deg); } }

  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(180deg, rgba(120,80,150,.15), rgba(90,60,120,.4));
    z-index: 1;
  }

  /* ---------- Alpaca ---------- */
  .stage {
    position: relative;
    width: 340px;
    height: 460px;
    z-index: 2;
  }

  .alpaca {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: 220px;
    height: 300px;
    transform-origin: bottom center;
    transform: translateX(-50%);
    animation: bounce 0.9s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0) rotate(-3deg) scaleY(1); }
    25%     { transform: translateX(-50%) translateY(-24px) rotate(0deg) scaleY(1.04); }
    50%     { transform: translateX(-50%) translateY(0) rotate(3deg) scaleY(1); }
    75%     { transform: translateX(-50%) translateY(-24px) rotate(0deg) scaleY(1.04); }
  }

  .fluff { fill: #fff6ec; stroke: #eddccb; stroke-width: 2; }
  .fluff-dark { fill: #f4e6d4; }
  .skin { fill: #d9b48a; }

  /* shadow */
  .shadow {
    position: absolute;
    bottom: 34px;
    left: 50%;
    width: 170px;
    height: 34px;
    background: rgba(80,40,90,.28);
    border-radius: 50%;
    transform: translateX(-50%);
    filter: blur(4px);
    animation: shadowPulse .9s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes shadowPulse {
    0%,50%,100% { transform: translateX(-50%) scale(1); opacity:.5; }
    25%,75% { transform: translateX(-50%) scale(.72); opacity:.32; }
  }

  /* head + neck bob */
  #head { transform-origin: 110px 190px; animation: headWave 1.8s ease-in-out infinite; }
  @keyframes headWave {
    0%,100% { transform: rotate(-6deg); }
    50%     { transform: rotate(8deg); }
  }

  /* ears wiggle */
  #earL { transform-origin: 90px 40px; animation: earL 0.9s ease-in-out infinite; }
  #earR { transform-origin: 135px 40px; animation: earR 0.9s ease-in-out infinite; }
  @keyframes earL { 0%,100%{transform:rotate(-10deg);}50%{transform:rotate(10deg);} }
  @keyframes earR { 0%,100%{transform:rotate(10deg);}50%{transform:rotate(-10deg);} }

  /* arms/legs wave */
  #legFL { transform-origin: 78px 232px; animation: waveA 0.9s ease-in-out infinite; }
  #legFR { transform-origin: 142px 232px; animation: waveB 0.9s ease-in-out infinite; }
  #legBL { transform-origin: 78px 232px; animation: waveB 0.9s ease-in-out infinite; }
  #legBR { transform-origin: 142px 232px; animation: waveA 0.9s ease-in-out infinite; }
  @keyframes waveA { 0%,100%{transform:rotate(18deg);}50%{transform:rotate(-18deg);} }
  @keyframes waveB { 0%,100%{transform:rotate(-18deg);}50%{transform:rotate(18deg);} }

  /* pom tail */
  #tail { transform-origin: 60px 200px; animation: tailWag 0.45s ease-in-out infinite; }
  @keyframes tailWag { 0%,100%{transform:rotate(-18deg);}50%{transform:rotate(18deg);} }

  /* blush pulse */
  .blush { fill:#ff9ec2; animation: blush 1.8s ease-in-out infinite; }
  @keyframes blush { 0%,100%{opacity:.55;}50%{opacity:.9;} }

  /* floating hearts / notes */
  .note {
    position: absolute;
    font-size: 26px;
    z-index: 3;
    animation: floatUp 4s linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.5) rotate(0); opacity:0; }
    15%{ opacity:1; }
    100%{ transform: translateY(-240px) scale(1.1) rotate(40deg); opacity:0; }
  }

  .title {
    position: absolute;
    top: 26px;
    width: 100%;
    text-align: center;
    color: #b8478a;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15);
    z-index: 5;
    animation: titleBob 2s ease-in-out infinite;
  }
  @keyframes titleBob { 0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);} }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="glow"></div>
  <div class="floor"></div>
  <div class="title">✨ Groovy Alpaca ✨</div>

  <div class="stage" id="stage">
    <div class="shadow"></div>
    <div class="alpaca">
      <svg viewBox="0 0 220 300" width="220" height="300">

        <!-- Tail pom-pom -->
        <g id="tail">
          <circle cx="52" cy="200" r="20" class="fluff"/>
          <circle cx="44" cy="192" r="10" class="fluff-dark"/>
          <circle cx="60" cy="208" r="9" class="fluff-dark"/>
          <circle cx="44" cy="210" r="9" class="fluff-dark"/>
          <circle cx="62" cy="192" r="9" class="fluff-dark"/>
        </g>

        <!-- Back legs -->
        <g id="legBL"><rect x="70" y="228" width="18" height="60" rx="9" class="skin"/><ellipse cx="79" cy="290" rx="12" ry="7" fill="#c49b70"/></g>
        <g id="legBR"><rect x="134" y="228" width="18" height="60" rx="9" class="skin"/><ellipse cx="143" cy="290" rx="12" ry="7" fill="#c49b70"/></g>

        <!-- Body (fluffy) -->
        <g>
          <ellipse cx="110" cy="205" rx="72" ry="60" class="fluff"/>
          <circle cx="60" cy="185" r="26" class="fluff"/>
          <circle cx="160" cy="185" r="26" class="fluff"/>
          <circle cx="80" cy="235" r="24" class="fluff"/>
          <circle cx="140" cy="235" r="24" class="fluff"/>
          <circle cx="110" cy="245" r="26" class="fluff"/>
          <circle cx="110" cy="160" r="30" class="fluff"/>
        </g>

        <!-- Front legs -->
        <g id="legFL"><rect x="72" y="228" width="18" height="62" rx="9" class="skin"/><ellipse cx="81" cy="292" rx="12" ry="7" fill="#c49b70"/></g>
        <g id="legFR"><rect x="132" y="228" width="18" height="62" rx="9" class="skin"/><ellipse cx="141" cy="292" rx="12" ry="7" fill="#c49b70"/></g>

        <!-- Head + long neck -->
        <g id="head">
          <!-- neck -->
          <path d="M95,190 Q90,120 100,70 L130,70 Q125,130 125,190 Z" class="skin"/>
          <!-- neck fluff -->
          <circle cx="100" cy="150" r="18" class="fluff"/>
          <circle cx="118" cy="120" r="16" class="fluff"/>
          <circle cx="104" cy="100" r="15" class="fluff"/>

          <!-- ears -->
          <g id="earL"><path d="M88,44 Q80,10 96,30 Q100,44 96,52 Z" class="skin"/></g>
          <g id="earR"><path d="M138,44 Q146,10 130,30 Q126,44 130,52 Z" class="skin"/></g>

          <!-- head top fluff -->
          <circle cx="113" cy="42" r="24" class="fluff"/>
          <circle cx="96" cy="52" r="15" class="fluff"/>
          <circle cx="130" cy="52" r="15" class="fluff"/>

          <!-- face -->
          <ellipse cx="113" cy="66" rx="26" ry="24" class="skin"/>
          <!-- snout -->
          <ellipse cx="113" cy="78" rx="16" ry="13" fill="#e8c9a4"/>

          <!-- eyes -->
          <circle cx="103" cy="62" r="6" fill="#3a2a20"/>
          <circle cx="123" cy="62" r="6" fill="#3a2a20"/>
          <circle cx="105" cy="60" r="2" fill="#fff"/>
          <circle cx="125" cy="60" r="2" fill="#fff"/>

          <!-- blush -->
          <ellipse class="blush" cx="94" cy="74" rx="7" ry="4"/>
          <ellipse class="blush" cx="132" cy="74" rx="7" ry="4"/>

          <!-- nose / mouth -->
          <ellipse cx="113" cy="76" rx="4" ry="3" fill="#8a5a44"/>
          <path d="M107,84 Q113,90 119,84" stroke="#8a5a44" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>

<script>
  // sprinkle twinkling stars
  const sky = document.getElementById('sky');
  const glyphs = ['✦','✧','⋆','✩','·'];
  for (let i=0;i<40;i++){
    const s=document.createElement('div');
    s.className='star';
    s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*70+'%';
    s.style.fontSize=(10+Math.random()*22)+'px';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.color=['#fff','#ffe6a7','#ffc2e0','#c2e0ff'][Math.floor(Math.random()*4)];
    sky.appendChild(s);
  }

  // floating music notes & hearts, spawned continuously (endless)
  const stage = document.getElementById('stage');
  const emojis = ['🎵','🎶','💖','⭐','💜','🎵','🩷'];
  function spawnNote(){
    const n=document.createElement('div');
    n.className='note';
    n.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    n.style.left=(60+Math.random()*200)+'px';
    n.style.top=(120+Math.random()*140)+'px';
    n.style.fontSize=(20+Math.random()*18)+'px';
    n.style.animationDuration=(3+Math.random()*2)+'s';
    stage.appendChild(n);
    setTimeout(()=>n.remove(),5200);
  }
  setInterval(spawnNote,650);
  spawnNote();
</script>
</body>
</html>
